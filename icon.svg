<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4DFE6"/>
      <stop offset="100%" stop-color="#E0A3BB"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5CC82"/>
      <stop offset="100%" stop-color="#97A13B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#642841" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Nền bo góc mềm mại -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Vòng tròn hào quang trung tâm -->
  <circle cx="256" cy="256" r="170" fill="#ffffff" filter="url(#shadow)" opacity="0.95"/>

  <!-- Biểu tượng Bánh xe cân bằng / Hoa năng lượng 5 cánh (5 loại vốn) -->
  <g transform="translate(256,256)">
    <!-- Trục năng lượng tái tạo -->
    <circle cx="0" cy="0" r="28" fill="#97A13B"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>

    <!-- 5 Cánh hoa tượng trưng cho 5 Loại Vốn -->
    <!-- Cánh 1: Sức khỏe (Olive) -->
    <path d="M 0 -35 C 25 -75 20 -125 0 -140 C -20 -125 -25 -75 0 -35 Z" fill="#97A13B"/>
    
    <!-- Cánh 2: Quan hệ (Mauve Rose) -->
    <path d="M 0 -35 C 25 -75 20 -125 0 -140 C -20 -125 -25 -75 0 -35 Z" fill="#E0A3BB" transform="rotate(72)"/>

    <!-- Cánh 3: Trải nghiệm (Thạch anh tím) -->
    <path d="M 0 -35 C 25 -75 20 -125 0 -140 C -20 -125 -25 -75 0 -35 Z" fill="#8b6da9" transform="rotate(144)"/>

    <!-- Cánh 4: Kỹ năng (Mist Cyan) -->
    <path d="M 0 -35 C 25 -75 20 -125 0 -140 C -20 -125 -25 -75 0 -35 Z" fill="#4a859c" transform="rotate(216)"/>

    <!-- Cánh 5: Tài chính (Vàng đồng) -->
    <path d="M 0 -35 C 25 -75 20 -125 0 -140 C -20 -125 -25 -75 0 -35 Z" fill="#b88628" transform="rotate(288)"/>

    <!-- Vòng quỹ đạo hạt năng lượng -->
    <circle cx="0" cy="-140" r="7" fill="#97A13B"/>
    <circle cx="0" cy="-140" r="7" fill="#E0A3BB" transform="rotate(72)"/>
    <circle cx="0" cy="-140" r="7" fill="#8b6da9" transform="rotate(144)"/>
    <circle cx="0" cy="-140" r="7" fill="#4a859c" transform="rotate(216)"/>
    <circle cx="0" cy="-140" r="7" fill="#b88628" transform="rotate(288)"/>
  </g>
</svg>
