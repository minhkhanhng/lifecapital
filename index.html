<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life Capital · Quản trị Năng lượng & Thời gian 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Capital">
<meta name="theme-color" content="#E0A3BB">
<style>
/* ==========================================================================
   BẢNG MÀU CHỦ ĐẠO & BỔ TRỢ:
   - Màu chủ đạo: #E0A3BB (Mauve Rose)
   - Màu bổ trợ:
     * #F4DFE6 (Blush Soft)
     * #D6E6E7 (Mist Cyan)
     * #C5CC82 (Sage Light Olive)
     * #97A13B (Deep Olive Green)
   - Nền web pha thêm 5% màu trắng để sáng và thông thoáng hơn
   ========================================================================== */
:root {
  color-scheme: light;
  --ac: #E0A3BB;               /* Màu chủ đạo: Mauve Rose */
  --ac-hover: #d28faa;
  --ac-soft: rgba(224, 163, 187, 0.22);
  --ac-dark: #642841;          /* Chữ tương phản cao */

  /* Màu bổ trợ */
  --c-blush: #F4DFE6;          /* Bổ trợ 1: Hồng phấn nhạt */
  --c-cyan: #D6E6E7;           /* Bổ trợ 2: Xanh ngọc mây nhạt */
  --c-sage: #C5CC82;           /* Bổ trợ 3: Xanh xám oliu sáng */
  --c-olive: #97A13B;          /* Bổ trợ 4: Xanh oliu đậm */

  /* Nền web pha thêm 5% màu trắng */
  --bg: #fdfcfd;
  --bg-color-mixed: color-mix(in srgb, #faf7f8 95%, #ffffff 5%);
  --card: #ffffff;
  --card-subtle: #fcf8fa;
  --tx: #251d21;
  --tx-sec: #594d53;
  --mu: #796b71;
  --bd: #ebdde2;
  --bd-focus: #E0A3BB;
  --bar: #F4DFE6;              /* Thanh tiến trình / track nền */

  --ok: #97A13B;               /* Nạp năng lượng ▲ (Olive đậm) */
  --ok-soft: rgba(197, 204, 130, 0.28);
  --bad: #c24d5b;              /* Rút năng lượng ▼ */
  --bad-soft: rgba(224, 163, 187, 0.25);
  --wa: #b87b1e;
  --wa-soft: rgba(184, 123, 30, 0.15);
  --hd: #642841;               /* Header bảng */

  --shadow-sm: 0 1px 3px rgba(100, 40, 65, 0.04);
  --shadow-md: 0 4px 14px rgba(100, 40, 65, 0.07);
  --shadow-lg: 0 12px 32px rgba(100, 40, 65, 0.14);

  --on-ac: #421629; --ac-text: #8a3f5f; --ok-text: #6c732a; --wa-text: #906525;            /* Chữ trên nền hồng phấn --ac: luôn tối để rõ nét */
  --on-olive: #1f2608;         /* Chữ trên nền xanh oliu đậm --c-olive */
  --on-cyan: #1a4245;          /* Chữ trên nền xanh mây --c-cyan */
  --on-blush: #642841;         /* Chữ trên nền blush --c-blush */

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151113;
    --bg-color-mixed: #151113;
    --card: #1f191c;
    --card-subtle: #292125;
    --tx: #f8eff3;
    --tx-sec: #b9abb2;
    --mu: #94858d;
    --ac: #E0A3BB;
    --ac-hover: #ebbcd0;
    --ac-soft: rgba(224, 163, 187, 0.2);
    --ac-dark: #642841;

    --c-blush: #34262c;
    --c-cyan: #1d2f31;
    --c-sage: #383e22;
    --c-olive: #C5CC82;

    --bd: #3d2f36;
    --bd-focus: #E0A3BB;
    --bar: #2b2226;
    --ok: #C5CC82;
    --ok-soft: rgba(197, 204, 130, 0.2);
    --bad: #ea6b77;
    --bad-soft: rgba(234, 107, 119, 0.2);
    --wa: #e5a13c;
    --wa-soft: rgba(229, 161, 60, 0.2);
    --hd: #381624;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);

    --on-ac: #381220; --ac-text: #E0A3BB; --ok-text: #C5CC82; --wa-text: #e5a13c;          /* Chữ trên nền hồng phấn --ac: luôn tối để rõ nét */
    --on-olive: #242c09;       /* Chữ trên nền xanh oliu sáng #C5CC82 */
    --on-cyan: #a3e8ee;        /* Chữ sáng trên nền cyan tối */
    --on-blush: #fcebf2;       /* Chữ sáng trên nền blush tối */
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151113;
  --bg-color-mixed: #151113;
  --card: #1f191c;
  --card-subtle: #292125;
  --tx: #f8eff3;
  --tx-sec: #b9abb2;
  --mu: #94858d;
  --ac: #E0A3BB;
  --ac-hover: #ebbcd0;
  --ac-soft: rgba(224, 163, 187, 0.2);
  --ac-dark: #642841;

  --c-blush: #34262c;
  --c-cyan: #1d2f31;
  --c-sage: #383e22;
  --c-olive: #C5CC82;

  --bd: #3d2f36;
  --bd-focus: #E0A3BB;
  --bar: #2b2226;
  --ok: #C5CC82;
  --ok-soft: rgba(197, 204, 130, 0.2);
  --bad: #ea6b77;
  --bad-soft: rgba(234, 107, 119, 0.2);
  --wa: #e5a13c;
  --wa-soft: rgba(229, 161, 60, 0.2);
  --hd: #381624;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);

  --on-ac: #381220; --ac-text: #E0A3BB; --ok-text: #C5CC82; --wa-text: #e5a13c;          /* Chữ trên nền hồng phấn --ac: luôn tối để rõ nét */
  --on-olive: #242c09;       /* Chữ trên nền xanh oliu sáng #C5CC82 */
  --on-cyan: #a3e8ee;        /* Chữ sáng trên nền cyan tối */
  --on-blush: #fcebf2;       /* Chữ sáng trên nền blush tối */
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg-color-mixed, var(--bg));
  color: var(--tx);
  font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}

/* App Shell */
.app-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 14px;
}

/* Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--bd);
}
.brand-area {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.brand-title {
  font: 700 24px/1.2 Georgia, "Times New Roman", serif;
  margin: 0;
  color: var(--tx);
  letter-spacing: -0.5px;
}
.brand-badge {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--ac-soft);
  color: var(--ac-text);
  padding: 3px 8px;
  border-radius: var(--radius-full);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Command Bar (Tính năng 4: Natural Language Quick Input) */
.quick-capture-box {
  background: var(--card);
  border: 1.5px solid var(--ac);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  margin-bottom: 16px;
  box-shadow: 0 2px 10px var(--ac-soft);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.quick-capture-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.quick-capture-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 14px;
  color: var(--tx);
  outline: none;
  padding: 4px 0;
}
.quick-capture-input::placeholder {
  color: var(--mu);
}
.quick-preview-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 12px;
  padding-top: 6px;
  border-top: 1px dashed var(--bd);
}

/* Primary Tabs Nav */
nav.main-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 12px 2px;
  position: sticky;
  top: 0;
  background: var(--bg-color-mixed, var(--bg));
  z-index: 20;
  backdrop-filter: blur(8px);
  -webkit-overflow-scrolling: touch;
}
nav.main-nav::-webkit-scrollbar { display: none; }
nav.main-nav button {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx-sec);
  padding: 8px 16px;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
nav.main-nav button:hover {
  background: var(--c-blush);
  color: var(--tx);
  border-color: var(--ac);
}
nav.main-nav button.active {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
  font-weight: 600;
  box-shadow: 0 2px 8px var(--ac-soft);
}

/* Card & Buttons */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.card-title {
  margin: 0;
  font: 600 17px/1.3 Georgia, serif;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-sub {
  color: var(--mu);
  font-size: 13px;
  margin-top: 3px;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  user-select: none;
}
.btn:hover {
  background: var(--c-blush);
  border-color: var(--ac);
}
.btn.btn-primary {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
  font-weight: 600;
}
.btn.btn-primary:hover {
  background: var(--ac-hover);
  box-shadow: 0 2px 8px var(--ac-soft);
}
.btn.btn-accent-olive {
  background: var(--c-olive);
  color: var(--on-olive);
  border-color: var(--c-olive);
}
.btn.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}
.btn.btn-ghost {
  border-color: transparent;
  background: transparent;
  box-shadow: none;
}
.btn.btn-ghost:hover {
  background: var(--c-blush);
}
.btn.btn-danger {
  color: var(--bad);
  border-color: var(--bad-soft);
}
.btn.btn-danger:hover {
  background: var(--bad-soft);
}

input, select, textarea {
  font: inherit;
  font-size: 13.5px;
  padding: 8px 12px;
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  background: var(--bg);
  color: var(--tx);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--bd-focus);
  box-shadow: 0 0 0 3px var(--ac-soft);
}
input[type="number"] { width: 80px; }
input[type="time"] { min-width: 105px; }

/* Status Badges */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
}
.pill.pill-ok { background: var(--ok-soft); color: var(--ok-text); }
.pill.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill.pill-cyan { background: var(--c-cyan); color: var(--on-cyan); }
.pill.pill-blush { background: var(--c-blush); color: var(--on-blush); }
.pill.pill-neutral { background: var(--bar); color: var(--tx-sec); }

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* View Switcher */
.segmented-control {
  display: inline-flex;
  background: var(--bar);
  padding: 3px;
  border-radius: var(--radius-md);
  gap: 2px;
}
.segmented-control button {
  border: none;
  background: transparent;
  color: var(--tx-sec);
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 500;
  border-radius: calc(var(--radius-md) - 2px);
  cursor: pointer;
  transition: all 0.15s ease;
}
.segmented-control button.active {
  background: var(--card);
  color: var(--tx);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* Pin năng lượng (Daily Battery Widget) */
.battery-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  font-size: 11.5px;
  font-weight: 600;
}
.battery-badge.positive {
  background: var(--ok-soft);
  color: var(--ok-text);
}
.battery-badge.negative {
  background: var(--bad-soft);
  color: var(--bad);
}
.battery-badge.balanced {
  background: var(--c-cyan);
  color: var(--on-cyan);
}
.battery-badge.idle {
  background: var(--bar);
  color: var(--mu);
}
.battery-icon {
  width: 18px;
  height: 10px;
  border: 1.5px solid currentColor;
  border-radius: 2.5px;
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 1px;
}
.battery-icon::after {
  content: "";
  position: absolute;
  right: -3.5px;
  top: 2px;
  bottom: 2px;
  width: 2px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}
.battery-fill {
  height: 100%;
  background: currentColor;
  border-radius: 1px;
  transition: width 0.3s;
}

/* Calendar Week Cards (Tuần chi tiết) */
.week-cards-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
@media (max-width: 992px) {
  .week-cards-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 640px) {
  .week-cards-grid { grid-template-columns: 1fr; }
}

.day-card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  min-height: 200px;
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.day-card:hover {
  border-color: var(--ac);
  box-shadow: var(--shadow-sm);
}
.day-card.today {
  border: 2px solid var(--ac);
  background: color-mix(in srgb, var(--ac) 5%, var(--card));
}
.day-card-header {
  padding: 8px 10px;
  background: var(--card-subtle);
  border-bottom: 1px solid var(--bd);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.day-card.today .day-card-header {
  background: var(--ac);
  color: var(--on-ac);
}
.day-card.today .day-card-header .day-name,
.day-card.today .day-card-header .day-date {
  color: var(--on-ac);
}
.day-name {
  font-weight: 600;
  font-size: 13px;
  color: var(--tx);
}
.day-date {
  font-size: 12px;
  color: var(--mu);
}
.day-battery-row {
  padding: 5px 10px;
  background: color-mix(in srgb, var(--bar) 50%, var(--card));
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--bd);
}
.day-events-list {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.day-card-add-btn {
  margin: 6px 8px 8px 8px;
  padding: 6px;
  border: 1px dashed var(--bd);
  background: transparent;
  color: var(--mu);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.15s ease;
}
.day-card-add-btn:hover {
  border-color: var(--ac);
  color: var(--ac-dark);
  background: var(--ac-soft);
}

/* Event Item */
.event-item {
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 12px;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  border-left: 3.5px solid transparent;
  background: var(--card-subtle);
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
}
.event-item:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.event-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
}
.event-title {
  font-weight: 600;
  color: var(--tx);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.event-meta {
  font-size: 11px;
  color: var(--mu);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.event-mode-up { color: var(--ok-text); font-weight: 700; }
.event-mode-down { color: var(--bad); font-weight: 700; }

/* Dòng thời gian 24h */
.timeline-container {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.timeline-days-nav {
  display: flex;
  gap: 6px;
  padding: 10px;
  background: var(--card-subtle);
  border-bottom: 1px solid var(--bd);
  overflow-x: auto;
}
.timeline-grid {
  position: relative;
  height: 864px; /* 18h từ 06:00 đến 24:00, mỗi giờ 48px */
  overflow-y: auto;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 47px,
    var(--bd) 48px
  );
}
.timeline-hour-mark {
  position: absolute;
  left: 10px;
  font-size: 11px;
  color: var(--mu);
  transform: translateY(-50%);
  user-select: none;
}
.timeline-content-area {
  position: absolute;
  left: 60px;
  right: 14px;
  top: 0;
  bottom: 0;
}
.timeline-event-block {
  position: absolute;
  left: 0;
  right: 0;
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-size: 12px;
  color: #fff;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  cursor: pointer;
  transition: transform 0.1s ease;
}
.timeline-event-block:hover {
  transform: scale(1.01);
  z-index: 5;
}

/* ==========================================================================
   CSS CHO LƯỚI 53 TUẦN (SỬA LỖI HIỂN THỊ)
   ========================================================================== */
.table-wrapper {
  overflow: auto;
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  background: var(--card);
  max-height: 72vh;
  box-shadow: var(--shadow-sm);
  position: relative;
  -webkit-overflow-scrolling: touch;
}
table.calendar-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 940px;
}
table.calendar-table th {
  background: var(--hd);
  color: #ffffff;
  padding: 10px 8px;
  position: sticky;
  top: 0;
  font-weight: 600;
  font-size: 13px;
  z-index: 10;
  text-align: center;
  border-bottom: 2px solid var(--bd);
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
table.calendar-table td {
  padding: 6px;
  border-top: 1px solid var(--bd);
  vertical-align: top;
  text-align: center;

<script>
/* ==========================================================================
   1. DỮ LIỆU CỐT LÕI (5 LOẠI VỐN VỚI BẢNG MÀU YÊU CẦU)
   ========================================================================== */
const DCAP = [
  ["sk", "Sức khỏe", "#97A13B", 6, ["gym", "bơi", "chạy bộ", "cầu lông", "đá bóng", "spa", "ngủ", "thể thao", "fitness", "yoga", "đi bộ", "sức khỏe", "massage", "nạp năng lượng"]],
  ["qh", "Quan hệ", "#E0A3BB", 5, ["dinner", "sinh nhật", "cưới", "gia đình", "bạn", "date", "chị", "em", "anh", "bố", "mẹ", "thăm", "ăn tối", "gặp mặt", "trò chuyện", "hẹn hò", "liên hoan"]],
  ["tn", "Trải nghiệm", "#8b6da9", 3, ["xem", "du lịch", "trip", "phim", "workshop", "thử", "concert", "cafe", "cà phê", "chill", "ăn uống", "dạo phố", "triển lãm", "bảo tàng", "khám phá"]],
  ["kn", "Kỹ năng", "#4a859c", 4, ["học", "đọc", "course", "study", "khóa", "sách", "tiếng anh", "code", "nghiên cứu", "luyện", "đàn", "viết", "podcast", "kỹ năng", "vẽ"]],
  ["tc", "Tài chính / công việc", "#b88628", 0, ["họp", "làm", "work", "meeting", "deep", "dự án", "khách", "bán", "deal", "deadline", "báo cáo", "ot", "tăng ca", "công ty", "văn phòng", "khách hàng", "tài chính", "tiền"]]
];
const DN_VI = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ Nhật"];
const DN_SHORT = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
const PALETTE = ["#E0A3BB", "#97A13B", "#4a859c", "#8b6da9", "#b88628", "#c24d5b", "#642841"];

const ad = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ky = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function getWeek1Monday(year) {
  const jan4 = new Date(year, 0, 4);
  const day = jan4.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return new Date(year, 0, 4 + diff);
}

function getWeeksOfYear(year) {
  const w0 = getWeek1Monday(year);
  const wNext0 = getWeek1Monday(year + 1);
  const count = Math.round((wNext0 - w0) / (7 * 864e5));
  return {
    w0,
    count,
    weeks: [...Array(count)].map((_, i) => ad(w0, i * 7))
  };
}

const isoYear = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() + 3 - ((d.getDay() + 6) % 7)).getFullYear();
let activeYear = isoYear(new Date());
let yearData = getWeeksOfYear(activeYear);
let W0 = yearData.w0;
let W = yearData.weeks;

function changeYear(delta) {
  activeYear += delta;
  yearData = getWeeksOfYear(activeYear);
  W0 = yearData.w0;
  W = yearData.weeks;
  CW = wkNow();
  sel = CW >= 0 ? CW : 0;
  draw(true);
  showToast(`Đã chuyển sang năm ${activeYear}`, "ok");
}

const sd = (m, d, t, c, h) => [ky(new Date(2026, m - 1, d)), { t, c, m: "u", h }];
const SEED = [
  [9, 9, "Đánh cầu", "sk", 2],
  [9, 10, "Spa", "sk", 2],
  [9, 11, "Đánh cầu", "sk", 2],
  [9, 13, "Đi xem cầu lông", "tn", 2],
  [9, 16, "Đánh cầu", "sk", 2],
  [9, 18, "Dinner w chị em GM", "qh", 2.5],
  [9, 25, "Đánh cầu", "sk", 2],
  [9, 28, "Đánh cầu", "sk", 2],
  [10, 2, "Dinner w bạn anh Tín", "qh", 2.5],
  [10, 5, "Đánh cầu", "sk", 2],
  [10, 7, "Đánh cầu", "sk", 2],
  [10, 8, "Dinner w LHương", "qh", 2.5],
  [10, 9, "Sinh nhật", "qh", 3],
  [10, 12, "Đánh cầu", "sk", 2],
  [10, 14, "Đánh cầu", "sk", 2],
  [10, 18, "Đám cưới bạn anh", "qh", 4]
];

function defState() {
  const ev = {};
  SEED.forEach(a => {
    const [k, e] = sd(...a);
    (ev[k] = ev[k] || []).push(e);
  });
  return {
    ev,
    caps: DCAP.map(c => ({ k: c[0], n: c[1], c: c[2], tg: c[3], kw: [...c[4]] })),
    bl: {},
    mem: {},
    pm: "0",
    cfg: { defDuration: 2, burnoutHours: 6 }
  };
}

const SAFE_K = /^(?!__proto__$)[\w-]{1,24}$/;
let S, rawSaved = null;
try { rawSaved = localStorage.getItem("lc2"); } catch (e) {}
try {
  S = rawSaved ? cleanState(JSON.parse(rawSaved)) : null;
} catch (e) {
  console.error("Không đọc được dữ liệu đã lưu:", e);
  S = null;
}
if (!S) {
  // Dữ liệu có nhưng không đọc được: giữ lại bản gốc để có thể cứu, rồi mới dùng dữ liệu mặc định
  if (rawSaved) { try { localStorage.setItem("lc2_unreadable", rawSaved); } catch (e) {} }
  S = defState();
}

if (!S.caps) S.caps = DCAP.map(c => ({ k: c[0], n: c[1], c: c[2], tg: (S.tg || {})[c[0]] ?? c[3], kw: [...c[4]] }));
S.caps.forEach(c => {
  if (!c.kw || !Array.isArray(c.kw) || !c.kw.length) {
    const def = DCAP.find(d => d[0] === c.k);
    if (def && def[4]) c.kw = [...def[4]];
  }
});
if (!S.cfg) S.cfg = { defDuration: 2, burnoutHours: 6 };
S.bl = S.bl || {};
S.mem = S.mem || {};

const cmp = (a, b) => (a.s || "99:99").localeCompare(b.s || "99:99");
const sortL = l => l.sort(cmp);
Object.values(S.ev).forEach(sortL);

const CM = k => S.caps.find(c => c.k === k) || { n: "(đã xóa)", c: "#888888", tg: 0 };
const BL = k => S.bl[k] = S.bl[k] || { u: 0, d: 0 };
const esc = s => String(s == null ? "" : s).replace(/[&<>"'`]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[c]));
const $ = i => document.getElementById(i);
const r1 = n => (Math.round((n || 0) * 10) / 10).toString();
const pad = n => String(n).padStart(2, "0");
const tt = (s, h) => {
  if (!s) return "";
  const [a, b] = s.split(":").map(Number);
  const m = Math.min(1439, a * 60 + b + Math.round((h || 0) * 60));
  return pad(m / 60 | 0) + ":" + pad(m % 60);
};

let CH = new Set(), PV = {}, dirty = false, TABDIR = 0;
const save = () => {
  dirty = true;
  try {
    localStorage.setItem("lc2", JSON.stringify(S));
  } catch (e) {
    showToast("Không thể lưu vào localStorage!", "bad");
  }
};

/* ==========================================================================
   2. TÍNH TOÁN TUẦN & LOGIC PIN NĂNG LƯỢNG
   ========================================================================== */
let T0, tk;
const wkNow = () => {
  const n = new Date();
  T0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  tk = ky(T0);
  const i = Math.floor(Math.round((T0 - W0) / 864e5) / 7);
  return i >= 0 && i < W.length ? i : -1;
};
let CW = wkNow(), lt = tk, sel = CW;
let cur = "ca"; // Tabs: "ca" (Lịch tuần), "su" (Hiệu suất 168h), "set" (Cài đặt vốn), "bak" (Sao lưu)
let calSubView = "focus"; // "focus" (Tuần chi tiết), "timeline" (Dòng thời gian 24h), "year" (Lưới 53 tuần)
let timelineDayIdx = 0; // 0 = T2 .. 6 = CN
let N = 4;
let ed = null, ei = null;

const evs = i => [0, 1, 2, 3, 4, 5, 6].flatMap(j => S.ev[ky(ad(W[i], j))] || []);
function wk(i, c) {
  const b = BL(c);
  let u = b.u, d = b.d;
  evs(i).forEach(e => {
    if (e.c === c) {
      if (e.m === "u") u += e.h;
      else d += e.h;
    }
  });
  return { u, d };
}
const al = i => S.caps.reduce((a, c) => {
  const w = wk(i, c.k);
  return a + w.u + w.d;
}, 0);

// Tính toán Pin năng lượng trong ngày
function getDayBattery(dateStr) {
  const events = S.ev[dateStr] || [];
  let u = 0, d = 0;
  events.forEach(e => {
    if (e.m === "u") u += e.h;
    else d += e.h;
  });
  const net = u - d;
  const burnoutH = (S && S.cfg && S.cfg.burnoutHours) ? S.cfg.burnoutHours : 6;
  const isBurnout = d >= burnoutH || (d - u >= 4);
  let fillPercent = 50;
  let statusClass = "idle";
  let label = "0h";

  if (events.length === 0) {
    fillPercent = 0;
    statusClass = "idle";
    label = "Chưa ghi";
  } else if (net > 0) {
    fillPercent = Math.min(100, 50 + net * 12);
    statusClass = "positive";
    label = `+${r1(net)}h Nạp`;
  } else if (net < 0) {
    fillPercent = Math.max(10, 50 + net * 10);
    statusClass = "negative";
    label = `${r1(net)}h Rút`;
  } else {
    fillPercent = 50;
    statusClass = "balanced";
    label = "Cân bằng";
  }

  return { u, d, net, fillPercent, statusClass, label, isBurnout };
}

function guess(t) {
  t = (t || "").normalize("NFC");
  const normTitle = t.trim().toLowerCase();
  const m = S.mem && S.mem[normTitle];
  if (m && S.caps.some(c => c.k === m.c)) return m.c;

  const w = " " + normTitle.split(/[^\p{L}\p{N}]+/u).join(" ") + " ";

  // Kiểm tra từ khóa tùy chỉnh của từng loại vốn do người dùng cài đặt
  for (const c of S.caps) {
    const kws = (c.kw && c.kw.length) ? c.kw : (DCAP.find(d => d[0] === c.k) ? DCAP.find(d => d[0] === c.k)[4] : []);
    if (kws.some(k => k && w.includes(" " + k.toLowerCase().trim() + " "))) {
      return c.k;
    }
  }

  return S.caps[0] ? S.caps[0].k : "sk";
}

function showToast(msg, type = "ok") {
  const c = $("toastContainer");
  if (!c) return;
  const t = document.createElement("div");
  t.className = `toast toast-${type}`;
  t.innerHTML = `${type === "ok" ? "✓" : "⚠"} <span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateY(10px)";
    t.style.transition = "all 0.2s ease";

  }, 2600);
}

/* ==========================================================================
   4. TÍNH NĂNG 4: NATURAL LANGUAGE QUICK PARSER (GHI NHANH)
   ========================================================================== */
let parsedNLP = null;

const toMin = s => { const [a, b] = s.split(":").map(Number); return a * 60 + b; };
const WB = p => new RegExp("(?<![\\p{L}\\p{N}])(?:" + p + ")(?![\\p{L}\\p{N}])", "iu");
const PER = "sáng|trưa|chiều|tối|đêm";

// Kiểm tra giờ/thời lượng/trùng giờ — dùng chung cho modal, ghi nhanh và chuỗi lặp
function chkEvent(date, s, h, skip) {
  if (!(h > 0 && h <= 24)) return { err: "Số giờ phải lớn hơn 0 và tối đa 24." };
  if (!s) return {};
  const mn = toMin(s);
  if (mn + h * 60 > 1440) return { err: "Hoạt động vượt quá nửa đêm. Hãy tách thành hai hoạt động." };
  const hit = (S.ev[date] || []).find((y, i) => i !== skip && y.s && toMin(y.s) < mn + h * 60 && mn < toMin(y.s) + y.h * 60);
  return { hit };
}

function parseNLPText(str) {
  if (!str || !str.trim()) return null;
  const raw = str.trim().normalize("NFC");
  let w = " " + raw + " ";
  const cut = re => { const m = w.match(re); if (m) w = w.replace(re, " "); return m; };
  const base = new Date(); base.setHours(0, 0, 0, 0);
  let target = base, dateDesc = "Hôm nay", per = null, m;
  const setPer = x => { if (x) per = x.toLowerCase(); };
  const wkBase = W[CW >= 0 ? CW : Math.min(Math.max(sel, 0), W.length - 1)];

  // 1. Phân tích Ngày
  if ((m = cut(/(?<![\p{L}\p{N}])(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\p{L}\p{N}])/u))) {
    const y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : base.getFullYear(), d = new Date(y, +m[2] - 1, +m[1]);
    if (d.getMonth() === +m[2] - 1) { target = d; dateDesc = DN_VI[(d.getDay() + 6) % 7] + " " + m[1] + "/" + m[2]; }
  } else if (cut(/(?<![\p{L}\p{N}])(?:ngày\s+)?(?:mốt|kia)(?![\p{L}\p{N}])/iu)) {
    target = ad(base, 2); dateDesc = "Ngày kia";
  } else if ((m = cut(/(?<![\p{L}\p{N}])(?:(sáng|trưa|chiều|tối|đêm)\s+|ngày\s+)mai(?![\p{L}\p{N}])/iu))) {
    setPer(m[1]); target = ad(base, 1); dateDesc = "Ngày mai";
  } else if ((m = cut(/(?<!(?:gặp|với|cùng|bạn|chị|em|anh|thăm|nhà|đón)\s+)(?<![\p{L}\p{N}])mai(?![\p{L}\p{N}])/iu))) {
    target = ad(base, 1); dateDesc = "Ngày mai";
  } else if ((m = cut(/(?<![\p{L}\p{N}])(?:(sáng|trưa|chiều|tối|đêm)\s+)?(?:hôm\s+)?nay(?![\p{L}\p{N}])/iu))) {
    setPer(m[1]); dateDesc = "Hôm nay";
  } else {
    let idx = null;
    if ((m = cut(/(?<![\p{L}\p{N}])(?:thứ|thu|t)\s*([2-7])(?![\p{L}\p{N}])/iu))) idx = +m[1] - 2;
    else if ((m = cut(/(?<![\p{L}\p{N}])thứ\s+(hai|ba|tư|bốn|năm|sáu|bảy)(?![\p{L}\p{N}])/iu))) idx = { hai: 0, ba: 1, tư: 2, bốn: 2, năm: 3, sáu: 4, bảy: 5 }[m[1].toLowerCase()];
    else if (cut(WB("chủ nhật|cn"))) idx = 6;
    if (idx !== null) {
      let d = ad(wkBase, idx);
      if (CW >= 0 && d < base) d = ad(d, 7);
      target = d;
      dateDesc = DN_VI[idx];
    }
  }

  // Bóc từ chỉ buổi nếu đứng riêng (trừ 'ăn tối', 'ăn trưa', 'ăn sáng')
  if (!per && (m = cut(/(?<!(?:ăn|bữa)\s+)(?<![\p{L}\p{N}])(sáng|trưa|chiều|tối|đêm)(?![\p{L}\p{N}])/iu))) {
    setPer(m[1]);
  }

  // 2. Phân tích Giờ bắt đầu & Thời lượng
  let start = null, dur = null;
  const hm = (a, b) => pad(Math.min(23, +a)) + ":" + pad(b ? +b : 0);
  const adj = (hr, p) => {
    p = p || per;
    if ((p === "chiều" || p === "tối") && hr < 12) return hr + 12;
    if (p === "trưa" && hr >= 1 && hr <= 5) return hr + 12;
    if (p === "đêm" && hr >= 6 && hr < 12) return hr + 12;
    return hr;
  };
  const ampm = (hr, ap) => /pm/i.test(ap) ? (hr < 12 ? hr + 12 : hr) : (hr === 12 ? 0 : hr);

  // Khoảng giờ: 14h-16h, 14:00 - 16:00
  if ((m = cut(/(?<![\p{L}\p{N}])(\d{1,2})(?:h|:|g)(\d{2})?\s*[-–]\s*(\d{1,2})(?:h|:|g)?(\d{2})?(?![\p{L}\p{N}])/iu))) {
    const a = adj(+m[1]) * 60 + (+m[2] || 0), b = adj(+m[3]) * 60 + (+m[4] || 0);
    if (b > a) { start = hm(a / 60 | 0, a % 60); dur = (b - a) / 60; }
  }

  // Bóc tách thời lượng rõ ràng trước
  if (dur === null) {
    if (cut(/(?<![\p{L}\p{N}])(?:nửa|1\/2)\s*(?:tiếng|giờ|h)(?![\p{L}\p{N}])/iu)) dur = 0.5;
    else if ((m = cut(/(?<![\p{L}\p{N}])(\d+(?:[.,]\d+)?)\s*(?:tiếng|giờ|gio|hrs?|hours?)(\s*rưỡi)?(?![\p{L}\p{N}])/iu))) dur = parseFloat(m[1].replace(",", ".")) + (m[2] ? 0.5 : 0);
    else if ((m = cut(/(?<![\p{L}\p{N}])(\d+(?:[.,]\d+)?)\s*h\s*rưỡi(?![\p{L}\p{N}])/iu))) dur = parseFloat(m[1].replace(",", ".")) + 0.5;
    else if ((m = cut(/(?<![\p{L}\p{N}])(\d+)\s*(?:phút|phut|min|p)(?![\p{L}\p{N}])/iu))) dur = Math.round(+m[1] / 60 * 100) / 100;
    else if ((m = cut(/(?<![\p{L}\p{N}])(?:trong\s*)(\d+(?:[.,]\d+)?)\s*h(?![\p{L}\p{N}])/iu))) dur = parseFloat(m[1].replace(",", "."));
  }

  // Giờ bắt đầu có mốc cụ thể
  if (start === null && (m = cut(/(?<![\p{L}\p{N}])(\d{1,2}):(\d{2})(?![\p{L}\p{N}])/u))) start = hm(adj(+m[1]), m[2]);
  if (start === null && (m = cut(/(?<![\p{L}\p{N}])(\d{1,2})[hg](\d{2})(?![\p{L}\p{N}])/iu))) start = hm(adj(+m[1]), m[2]);
  if (start === null && (m = cut(/(?<![\p{L}\p{N}])(?:lúc|từ|vào|at|@)\s*(\d{1,2})(?:\s*(?:h|giờ|g))?(?:\s*(sáng|trưa|chiều|tối|đêm|am|pm))?(?![\p{L}\p{N}])/iu))) {
    const p = m[2];
    if (p && /^(am|pm)$/i.test(p)) start = hm(ampm(+m[1], p), 0);
    else { setPer(p); start = hm(adj(+m[1]), 0); }
  }
  if (start === null && (m = cut(/(?<![\p{L}\p{N}])(\d{1,2})\s*(?:h|giờ|g)?\s*(am|pm)(?![\p{L}\p{N}])/iu))) start = hm(ampm(+m[1], m[2]), 0);
  if (start === null && (m = cut(/(?<![\p{L}\p{N}])(\d{1,2})\s*(?:h|giờ|g)?\s*(sáng|trưa|chiều|tối|đêm)(?![\p{L}\p{N}])/iu))) {
    setPer(m[2]); start = hm(adj(+m[1]), 0);
  }

  // Quét các chữ "Xh" hoặc "X.Xh" còn lại trong chuỗi
  while ((m = cut(/(?<![\p{L}\p{N}])(\d{1,2}(?:[.,]\d+)?)\s*h(?![\p{L}\p{N}])/iu))) {
    const val = parseFloat(m[1].replace(",", "."));
    if (start === null && (val >= 6 || dur !== null)) {
      start = hm(adj(Math.floor(val)), Math.round((val % 1) * 60));
    } else if (dur === null) {
      dur = val;
    } else if (start === null) {
      start = hm(adj(Math.floor(val)), Math.round((val % 1) * 60));
    }
  }

  const key = ky(target);
  if (start === null) {
    const dm = { sáng: "07:00", trưa: "12:00", chiều: "15:00", tối: "19:00", đêm: "21:00" };
    const lastEv = (S.ev[key] || []).filter(e => e.s).pop();
    start = per ? dm[per] : lastEv ? tt(lastEv.s, lastEv.h) : "07:00";
  }
  if (dur === null) dur = (S.cfg && S.cfg.defDuration) || 2;

  // 3. Tên hoạt động, tác động, loại vốn
  let title = w.replace(/(?<![\p{L}\p{N}])(?:lúc|từ|vào|at|@|trong)(?![\p{L}\p{N}])/giu, " ")
               .replace(/[,;]+/g, " ")
               .replace(/\s+/g, " ")
               .trim();
  if (!title) title = "Hoạt động mới";
  const mode = WB("họp|meeting|deadline|ot|tăng ca|làm việc|công việc|xử lý|áp lực|stress|báo cáo").test(title) ? "d" : "u";
  const c = chkEvent(key, start, dur, -1);
  return { raw, title, targetDate: key, dateDesc: dateDesc + " (" + key.slice(5) + ")", startTime: start, duration: dur, capKey: guess(title), mode, err: c.err, hit: c.hit };
}

function handleNLPInput(val) {
  parsedNLP = parseNLPText(val);
  const p = $("nlpPreview");
  if (!parsedNLP) { p.style.display = "none"; return; }
  const r = parsedNLP, cap = CM(r.capKey);
  p.style.display = "flex";
  p.innerHTML = `
    <span class="pill pill-cyan">📅 ${esc(r.dateDesc)}</span>
    <span class="pill pill-neutral">⏰ ${r.startTime} – ${tt(r.startTime, r.duration)} (${r1(r.duration)}h)</span>
    <span class="pill ${r.mode === "u" ? "pill-ok" : "pill-bad"}">${r.mode === "u" ? "▲ Nạp" : "▼ Tiêu"}</span>
    <span class="pill" style="background:${cap.c}; color:#fff;">🏷️ ${esc(cap.n)}</span>
    <span style="font-weight:600; color:var(--tx); margin-left:4px;">"${esc(r.title)}"</span>
    ${r.err ? `<span class="pill pill-bad">⚠ ${esc(r.err)}</span>` : r.hit ? `<span class="pill pill-bad">⚠ Trùng giờ với "${esc(r.hit.t)}"</span>` : ""}`;
}

function executeNLP() {
  const input = $("nlpInput");
  const r = parseNLPText(input.value);
  if (!r) { showToast("Vui lòng nhập nội dung!", "bad"); return; }
  if (r.err) { showToast(r.err, "bad"); return; }
  if (r.hit && !confirm(`Trùng giờ với "${r.hit.t}" (${r.hit.s}). Vẫn thêm?`)) return;
  const L = S.ev[r.targetDate] = S.ev[r.targetDate] || [];
  L.push({ t: r.title, c: r.capKey, m: r.mode, h: r.duration, s: r.startTime });
  sortL(L);
  S.mem[r.title.normalize("NFC").toLowerCase()] = { c: r.capKey };
  save();
  input.value = "";
  handleNLPInput("");

  // Tự động chuyển năm nếu hoạt động thuộc năm khác
  const evtYear = parseInt(r.targetDate.slice(0, 4));
  if (evtYear && evtYear !== activeYear) {
    activeYear = evtYear;
    yearData = getWeeksOfYear(activeYear);
    W0 = yearData.w0;
    W = yearData.weeks;
    CW = wkNow();
  }

  // Tự động đồng bộ tuần và ngày để hiển thị ngay hoạt động vừa tạo
  const targetWk = W.findIndex(m => {
    const e = ad(m, 6);
    return ky(m) <= r.targetDate && r.targetDate <= ky(e);
  });
  if (targetWk >= 0) sel = targetWk;
  const dObj = new Date(r.targetDate + "T00:00");
  timelineDayIdx = (dObj.getDay() + 6) % 7;

  draw();
  showToast(`Đã thêm: "${r.title}" vào ${r.dateDesc}`, "ok");
}

/* ==========================================================================
   5. TÍNH NĂNG 1: BÁNH XE CUỘC ĐỜI (WHEEL OF LIFE RADAR CHART SVG)
   ========================================================================== */
function renderRadarChartSVG(weekIdx) {
  const caps = S.caps;
  const numCaps = caps.length;
  if (numCaps < 3) return `<p style="color:var(--mu); text-align:center; padding:20px;">Cần ít nhất 3 loại vốn để vẽ biểu đồ radar.</p>`;

  const VB = 560, cx = 280, cy = 160, r = 95;
  const angles = caps.map((_, i) => -Math.PI / 2 + (i * 2 * Math.PI / numCaps));

  // Vòng cấp độ: 33%, 66%, 100% mục tiêu
  const levelPolygons = [0.33, 0.66, 1.0].map(lvl => {
    const pts = angles.map(a => `${(cx + r * lvl * Math.cos(a)).toFixed(1)},${(cy + r * lvl * Math.sin(a)).toFixed(1)}`).join(" ");
    const isTarget = lvl === 1.0;
    return `<polygon points="${pts}" fill="none" stroke="${isTarget ? 'var(--ac)' : 'var(--bd)'}" stroke-width="${isTarget ? '1.5' : '1'}" stroke-dasharray="${isTarget ? '' : '3,3'}" opacity="${isTarget ? '0.9' : '0.8'}" />`;
  }).join("");

  const axisLines = angles.map(a => `<line x1="${cx}" y1="${cy}" x2="${(cx + r * Math.cos(a)).toFixed(1)}" y2="${(cy + r * Math.sin(a)).toFixed(1)}" stroke="var(--bd)" stroke-width="1" opacity="0.7" />`).join("");

  const levelLabels = `
    <text x="${cx + 13}" y="${(cy - r * 0.33).toFixed(1)}" font-size="10" fill="var(--mu)">33%</text>
    <text x="${cx + 13}" y="${(cy - r * 0.66).toFixed(1)}" font-size="10" fill="var(--mu)">66%</text>
    <text x="${cx + 13}" y="${(cy - r).toFixed(1)}" font-size="10" font-weight="600" fill="var(--ac-text)">100%</text>`;

  // Số liệu từng vốn. Vốn chưa đặt mục tiêu KHÔNG được so với mốc tùy ý: đặt ở tâm (marker rỗng) và không tính vào điểm cân bằng.
  const stats = caps.map(c => {
    const w = wk(weekIdx, c.k);
    const has = c.tg > 0;
    return { c, u: w.u, has, pct: has ? Math.round(w.u / c.tg * 100) : null, ratio: has ? Math.min(1, Math.max(0, w.u / c.tg)) : 0 };
  });
  const pts = stats.map((s, i) => ({ s, x: cx + r * s.ratio * Math.cos(angles[i]), y: cy + r * s.ratio * Math.sin(angles[i]) }));
  const polyStr = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const dots = pts.map(p => {
    const s = p.s, x = p.x.toFixed(1), y = p.y.toFixed(1);
    if (!s.has) return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--card)" stroke="${s.c.c}" stroke-width="2" />`;
    const ring = s.pct >= 100 ? `<circle cx="${x}" cy="${y}" r="8.5" fill="none" stroke="var(--ok-text)" stroke-width="1.8" />` : "";
    return ring + `<circle cx="${x}" cy="${y}" r="4.5" fill="${s.c.c}" stroke="var(--card)" stroke-width="1.5" />`;
  }).join("");

  // Nhãn: cắt tên theo chỗ còn trống để không tràn khung, tên đầy đủ nằm trong <title>
  const fs1 = numCaps > 10 ? 10 : 11.5, fs2 = numCaps > 10 ? 9 : 10.5, charW = fs1 * 0.6;
  const labels = stats.map((s, i) => {
    const cos = Math.cos(angles[i]), sin = Math.sin(angles[i]);
    const lx = cx + (r + 32) * cos, ly = cy + (r + 32) * sin;
    const anchor = Math.abs(cos) < 0.25 ? "middle" : cos > 0 ? "start" : "end";
    const avail = anchor === "middle" ? 2 * Math.min(lx, VB - lx) : anchor === "start" ? VB - lx - 4 : lx - 4;
    const maxCh = Math.max(6, Math.floor(avail / charW));
    const name = s.c.n.length > maxCh ? s.c.n.slice(0, maxCh - 1).trimEnd() + "…" : s.c.n;
    const statusColor = s.pct == null ? "var(--mu)" : s.pct >= 100 ? "var(--ok-text)" : s.pct >= 60 ? "var(--wa-text)" : "var(--bad)";
    const sub = s.has ? `${r1(s.u)}h / ${r1(s.c.tg)}h (${s.pct}%)` : `${r1(s.u)}h (chưa đặt mục tiêu)`;
    return `<g><title>${esc(s.c.n)}: ${sub}</title>
      <text x="${lx.toFixed(1)}" y="${(ly - 2).toFixed(1)}" text-anchor="${anchor}" font-size="${fs1}" font-weight="600" fill="var(--tx)">${esc(name)}</text>
      <text x="${lx.toFixed(1)}" y="${(ly + 12).toFixed(1)}" text-anchor="${anchor}" font-size="${fs2}" fill="${statusColor}">${sub}</text></g>`;
  }).join("");

  // Điểm cân bằng: chỉ tính các vốn đã đặt mục tiêu
  const tg = stats.filter(s => s.has);
  let balanceHtml;
  if (!tg.length) {
    balanceHtml = `<span class="pill pill-blush">🎯 Chưa tính điểm cân bằng</span>
      <span style="color:var(--mu); font-size:12px;">Hãy đặt mục tiêu ▲/tuần ở tab Danh mục vốn.</span>`;
  } else {
    const ratios = tg.map(s => Math.min(1, s.u / s.c.tg));
    const avgR = ratios.reduce((a, b) => a + b, 0) / ratios.length, minR = Math.min(...ratios);
    const score = Math.round((avgR * 0.6 + minR * 0.4) * 100);
    const label = score >= 80 ? "Bánh xe rất tròn và cân đối" : score >= 50 ? "Khá cân đối, cần nạp thêm vốn còn thiếu" : "Bánh xe bị méo, cần tái cân bằng";
    const weakest = tg[ratios.indexOf(minR)];
    balanceHtml = `<span class="pill pill-blush">🎯 Điểm cân bằng bánh xe: <b>${score}%</b></span>
      <span style="color:var(--mu); font-size:12px;">${label}.${score < 80 ? ` Yếu nhất: <b>${esc(weakest.c.n)}</b> (${Math.round(minR * 100)}%).` : ""}${tg.length < stats.length ? ` Chưa tính ${stats.length - tg.length} vốn không có mục tiêu.` : ""}</span>`;
  }

  const aria = "Bánh xe cuộc đời: " + stats.map(s => `${s.c.n} ${s.has ? s.pct + "%" : "chưa đặt mục tiêu"}`).join(", ");
  return `
    <div class="radar-box" style="flex-direction:column; gap:12px;">
      <svg class="radar-svg" viewBox="0 0 ${VB} 330" role="img" aria-label="${esc(aria)}" style="max-width:520px; overflow:visible;">
        ${levelPolygons}
        ${axisLines}
        ${levelLabels}
        <polygon points="${polyStr}" fill="rgba(224, 163, 187, 0.28)" stroke="var(--ac)" stroke-width="2.5" />
        ${dots}
        ${labels}
      </svg>
      <div style="font-size:11.5px; color:var(--mu); text-align:center;">Điểm nằm trên vòng 100% là đã đạt mục tiêu (có viền xanh nếu đạt hoặc vượt) · chấm rỗng: chưa đặt mục tiêu</div>
      <div style="display:flex; justify-content:center; align-items:center; gap:12px; font-size:12.5px; margin-top:6px; flex-wrap:wrap; text-align:center;">
        ${balanceHtml}
      </div>
    </div>
  `;
}

/* ==========================================================================
   6. TÍNH NĂNG 8: SUNDAY WEEKLY REVIEW MODAL (TỔNG KẾT TUẦN)
   ========================================================================== */
function closeReviewModal() {
  const ov = $("reviewModalOverlay"), wasOpen = ov.classList.contains("open");
  ov.classList.remove("open");

}

function openWeeklyReviewModal(wIdx = sel) {
  wIdx = Math.max(0, Math.min(W.length - 1, wIdx));
  const wStart = W[wIdx];
  const wEnd = ad(wStart, 6);
  const rangeStr = `Tuần W${wIdx + 1} (${wStart.toLocaleDateString("vi-VN", { day: "numeric", month: "numeric" })} – ${wEnd.toLocaleDateString("vi-VN", { day: "numeric", month: "numeric", year: "numeric" })})`;

  $("reviewSheetTitle").innerHTML = `<span>🏆 Báo Cáo Tổng Kết Tuần W${wIdx + 1}</span>`;

  let totalU = 0, totalD = 0;
  S.caps.forEach(c => {
    const w = wk(wIdx, c.k);
    totalU += w.u;
    totalD += w.d;
  });
  const totalAlloc = al(wIdx);
  const freeTime = Math.max(0, 168 - totalAlloc);
  const netEnergy = totalU - totalD;
  const noData = evs(wIdx).length === 0;

  // Thống kê chi tiết từng vốn
  const capStats = S.caps.map(c => {
    const w = wk(wIdx, c.k);
    const target = c.tg || 0;
    const ratio = target > 0 ? (w.u / target) : (w.u > 0 ? 1 : 0);
    return { c, u: w.u, d: w.d, target, ratio, diff: w.u - target };
  });

  // Phân tích áp lực hàng ngày trong tuần
  const dailyBreakdown = [];
  for (let di = 0; di < 7; di++) {
    const dDate = ad(wStart, di);
    const dStr = ky(dDate);
    const dayEvs = S.ev[dStr] || [];
    let du = 0, dd = 0;
    dayEvs.forEach(e => { if (e.m === "u") du += e.h; else dd += e.h; });
    dailyBreakdown.push({ dayName: DN_VI[di], dStr, dd, du });
  }
  const peakDrain = [...dailyBreakdown].sort((a, b) => b.dd - a.dd)[0];
  const peakRecharge = [...dailyBreakdown].sort((a, b) => b.du - a.du)[0];

  const starCap = [...capStats].filter(x => x.u > 0).sort((a, b) => (b.ratio || 0) - (a.ratio || 0))[0];
  const laggingCap = [...capStats].filter(x => x.target > 0).sort((a, b) => a.diff - b.diff)[0];
  const neglectedCaps = capStats.filter(x => x.u === 0 && x.d === 0);
  const drainExceedingCaps = capStats.filter(x => x.d > 0 && x.d > x.u);

  // Nhận định Cán cân năng lượng
  let energyInsight = "";
  if (noData) {
    energyInsight = "Chưa có hoạt động nào được ghi nhận trong tuần này. Hãy ghi lại các thói quen hàng ngày để ứng dụng đo lường và đưa ra nhận định chính xác.";
  } else if (netEnergy >= 4) {
    energyInsight = `<b>Tái tạo năng lượng xuất sắc (Thặng dư +${r1(netEnergy)}h):</b> Tổng nạp (${r1(totalU)}h) vượt trội hoàn toàn so với tiêu hao (${r1(totalD)}h). Bạn đang có mức tích lũy pin sinh học dồi dào, tâm lý tích cực và thể lực vững vàng.`;
  } else if (netEnergy >= 0) {
    energyInsight = `<b>Cán cân năng lượng cân bằng lành mạnh (+${r1(netEnergy)}h):</b> Hoạt động tái tạo (${r1(totalU)}h) vừa đủ bù đắp năng lượng tiêu hao (${r1(totalD)}h). Cơ thể ở trạng thái ổn định, không có tích tụ kiệt sức.`;
  } else if (netEnergy >= -4) {
    energyInsight = `<b>Thâm hụt năng lượng nhẹ (${r1(netEnergy)}h):</b> Tiêu hao (${r1(totalD)}h) bắt đầu vượt lượng nạp (${r1(totalU)}h). Hãy chủ động tăng thời lượng ngủ và thư giãn để tránh mệt mỏi tích lũy.`;
  } else {
    energyInsight = `<b>Cảnh báo mức độ kiệt sức cao (-${r1(Math.abs(netEnergy))}h):</b> Áp lực và năng lượng tiêu hao (${r1(totalD)}h) quá nặng nề so với phục hồi (${r1(totalU)}h). Nguy cơ kiệt sức sinh học (burnout) rất cao nếu tiếp tục duy trì nhịp độ này.`;
  }

  // Nhận định Quỹ 168 giờ
  let timeInsight = "";
  if (noData) {
    timeInsight = "Quỹ 168 giờ hoàn toàn trống.";
  } else if (totalAlloc > 168) {
    timeInsight = `<b>Quá tải quỹ thời gian (+${r1(totalAlloc - 168)}h):</b> Bạn đã phân bổ ${r1(totalAlloc)}h / 168h (${Math.round(totalAlloc/168*100)}%). Lịch trình đang bị dồn ép quá mức, lấn chiếm vào thời gian nghỉ ngơi và sinh hoạt cơ bản.`;
  } else if (totalAlloc >= 110) {
    timeInsight = `<b>Kiểm soát quỹ thời gian tối ưu (${r1(totalAlloc)}h / 168h):</b> Lịch trình được tổ chức chặt chẽ (${Math.round(totalAlloc/168*100)}%), đồng thời vẫn giữ được ${r1(freeTime)}h vùng đệm tự do cho sinh hoạt cá nhân.`;
  } else {
    timeInsight = `<b>Quỹ thời gian rất thông thoáng (${r1(totalAlloc)}h / 168h):</b> Bạn còn ${r1(freeTime)}h chưa phân bổ (${Math.round(freeTime/168*100)}%). Bạn hoàn toàn có thể chủ động thêm các mục tiêu phát triển chuyên môn hoặc rèn luyện thể chất.`;
  }

  const html = `
    <div style="display:flex; flex-direction:column; gap:14px;">
      <!-- BỘ CHỌN TUẦN TỔNG KẾT LINH HOẠT -->
      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--card-subtle); padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--bd); flex-wrap:wrap; gap:8px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <button type="button" class="btn btn-sm" onclick="openWeeklyReviewModal(Math.max(0, ${wIdx} - 1))" title="Xem tuần trước">◀</button>
          <select onchange="openWeeklyReviewModal(+this.value)" style="font-weight:600; padding:5px 10px; font-size:13px; border-radius:var(--radius-sm); border:1px solid var(--bd); background:var(--card); color:var(--tx); cursor:pointer;">
            ${W.map((m, i) => {
              const mEnd = ad(m, 6);
              const rStr = `${m.toLocaleDateString("vi-VN", { day: "numeric", month: "numeric" })} – ${mEnd.toLocaleDateString("vi-VN", { day: "numeric", month: "numeric" })}`;
              return `<option value="${i}" ${i === wIdx ? 'selected' : ''}>Tuần W${i + 1} (${rStr})${i === CW ? ' · Tuần này' : ''}</option>`;
            }).join("")}
          </select>
          <button type="button" class="btn btn-sm" onclick="openWeeklyReviewModal(Math.min(W.length - 1, ${wIdx} + 1))" title="Xem tuần sau">▶</button>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${CW >= 0 && wIdx !== CW ? `
            <button type="button" class="btn btn-sm btn-ghost" onclick="openWeeklyReviewModal(CW)" style="color:var(--ac-text); font-weight:600; font-size:12px;">
              Về tuần hiện tại (W${CW + 1})
            </button>
          ` : `<span class="pill pill-ok" style="font-size:11px;">Tuần hiện tại</span>`}
        </div>
      </div>

      <!-- 3 THẺ CHỈ SỐ CỐT LÕI -->
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px;">
        <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
          <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Tổng Nạp / Tiêu</div>
          <div style="font:700 20px Georgia, serif; margin-top:4px;">
            <span style="color: var(--ok-text)">▲${r1(totalU)}h</span> · <span style="color:var(--bad)">▼${r1(totalD)}h</span>
          </div>
          <small style="color:var(--tx-sec)">Cán cân: <b>${netEnergy >= 0 ? '+' : ''}${r1(netEnergy)}h</b></small>
        </div>
        <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
          <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Quỹ 168 Giờ</div>
          <div style="font:700 20px Georgia, serif; margin-top:4px;">
            ${r1(totalAlloc)}h <span style="font-size:13px; font-weight:400; color:var(--mu);">(${Math.round(totalAlloc/168*100)}%)</span>
          </div>
          <small style="color:${totalAlloc > 168 ? 'var(--bad)' : 'var(--ok)'}">
            ${totalAlloc > 168 ? 'Vượt giới hạn 168h!' : `Còn ${r1(freeTime)}h tự do`}
          </small>
        </div>
        <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
          <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Đánh giá pin tuần</div>
          <div style="font:700 20px Georgia, serif; margin-top:4px; color:${netEnergy >= 0 ? 'var(--ok)' : 'var(--bad)'}">
            ${noData ? '— Chưa có dữ liệu' : netEnergy >= 4 ? '🔋 Nạp pin xuất sắc' : netEnergy >= 0 ? '🔋 Pin ổn định' : '🪫 Thâm hụt pin'}
          </div>
          <small style="color:var(--tx-sec)">${noData ? 'Ghi hoạt động để đánh giá' : netEnergy >= 0 ? 'Cân bằng phục hồi tốt' : 'Cần bù đắp nghỉ ngơi tuần tới'}</small>
        </div>
      </div>

      <!-- BÁNH XE CUỘC ĐỜI CỦA TUẦN ĐÓ -->
      <div style="border:1px solid var(--bd); border-radius:var(--radius-md); padding:12px; background:var(--card);">
        <div style="font-weight:600; font-size:14px; margin-bottom:4px; text-align:center;">
          Bánh Xe Cuộc Đời · Tuần W${wIdx + 1}
        </div>
        ${renderRadarChartSVG(wIdx)}
      </div>

      <!-- PHÂN TÍCH CHUYÊN SÂU & INSIGHTS ĐA CHIỀU -->
      <div style="display:flex; flex-direction:column; gap:10px; font-size:13px;">
        <!-- Insight 1: Cán cân năng lượng -->
        <div style="padding:12px 14px; background:var(--card-subtle); border-radius:var(--radius-md); border:1px solid var(--bd); border-left:4px solid ${netEnergy >= 0 ? 'var(--ok)' : 'var(--bad)'};">
          <div style="font-weight:600; font-size:13.5px; margin-bottom:4px; display:flex; align-items:center; gap:6px;">

          <div style="color:var(--tx); line-height:1.5;">${energyInsight}</div>
          ${peakDrain && peakDrain.dd > 2 ? `<div style="font-size:12px; color:var(--mu); margin-top:6px;">• Ngày chịu áp lực lớn nhất: <b>${peakDrain.dayName}</b> (tiêu hao ${r1(peakDrain.dd)}h).</div>` : ''}
          ${peakRecharge && peakRecharge.du > 2 ? `<div style="font-size:12px; color:var(--mu); margin-top:2px;">• Ngày tái tạo năng lượng tốt nhất: <b>${peakRecharge.dayName}</b> (nạp +${r1(peakRecharge.du)}h).</div>` : ''}
        </div>

        <!-- Insight 2: Quỹ 168h -->
        <div style="padding:12px 14px; background:var(--card-subtle); border-radius:var(--radius-md); border:1px solid var(--bd); border-left:4px solid var(--c-cyan);">
          <div style="font-weight:600; font-size:13.5px; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
            <span>⏳ Quản Trị Quỹ 168 Giờ</span>
          </div>
          <div style="color:var(--tx); line-height:1.5;">${timeInsight}</div>
        </div>

        <!-- Insight 3: Đánh giá từng nguồn vốn -->
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${starCap ? `
            <div style="padding:10px 14px; background:var(--ok-soft); border-radius:var(--radius-md); border-left:4px solid var(--ok);">
              ⭐ <b>Điểm sáng của tuần:</b> Vốn <b>${esc(starCap.c.n)}</b> đạt <b>${r1(starCap.u)}h</b>${starCap.target ? ' (hoàn thành ' + Math.round(starCap.ratio*100) + '% mục tiêu)' : ''} — là nguồn cảm hứng bồi đắp lớn nhất tuần này.
            </div>
          ` : ''}
          ${laggingCap && laggingCap.diff < 0 ? `
            <div style="padding:10px 14px; background:var(--bad-soft); border-radius:var(--radius-md); border-left:4px solid var(--bad);">
              ⚠️ <b>Cần tiếp sức khẩn cấp:</b> Vốn <b>${esc(laggingCap.c.n)}</b> chỉ đạt <b>${r1(laggingCap.u)}h</b> / ${r1(laggingCap.target)}h (thiếu hụt <b>${r1(Math.abs(laggingCap.diff))}h</b>). Trục này đang làm bánh xe cuộc đời bị lệch.
            </div>
          ` : ''}
          ${drainExceedingCaps.length ? `
            <div style="padding:10px 14px; background:var(--wa-soft); border-radius:var(--radius-md); border-left:4px solid var(--wa);">
              ⚡ <b>Vốn chịu tải cao (Tiêu > Nạp):</b> <b>${drainExceedingCaps.map(x => esc(x.c.n) + ' (tiêu ' + r1(x.d) + 'h > nạp ' + r1(x.u) + 'h)').join(', ')}</b>.
            </div>
          ` : ''}
          ${neglectedCaps.length ? `
            <div style="padding:8px 12px; background:var(--card-subtle); border-radius:var(--radius-md); border:1px solid var(--bd); font-size:12.5px; color:var(--mu);">
              💤 <b>Chưa phân bổ thời gian:</b> Tuần này bạn chưa dành thời lượng cho <b>${neglectedCaps.map(x => esc(x.c.n)).join(', ')}</b>.
            </div>
          ` : ''}
        </div>
      </div>

      <!-- Insight 4: Kế hoạch hành động cụ thể cho tuần tới -->
      <div style="padding:14px; background:var(--c-blush); border-radius:var(--radius-md); font-size:13px; color:var(--on-blush); border:1px solid var(--ac);">

          <div>2. <b>Bảo vệ năng lượng:</b> ${peakDrain && peakDrain.dd > 3 ? `Nếu <b>${peakDrain.dayName}</b> tiếp tục là ngày bận rộn, hãy chủ động nghỉ ngơi sớm vào tối hôm đó.` : 'Giữ thói quen ngủ đủ giấc để duy trì pin năng lượng dương.'}</div>
          <div>3. <b>Giữ vững đà tăng trưởng:</b> Tiếp tục phát huy thế mạnh ở vốn <b>${starCap ? esc(starCap.c.n) : 'chủ lực'}</b>.</div>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn" onclick="copyReviewToClipboard(${wIdx})">📋 Sao chép tóm tắt</button>
        <button type="button" class="btn btn-primary" onclick="closeReviewModal()">Đóng</button>
      </div>
    </div>
  `;

  $("reviewSheetBody").innerHTML = html;
  $("reviewModalOverlay").classList.add("open");
}

function copyReviewToClipboard(wIdx) {
  let totalU = 0, totalD = 0;
  S.caps.forEach(c => {
    const w = wk(wIdx, c.k);
    totalU += w.u;
    totalD += w.d;
  });
  const text = `🏆 [Life Capital] Tổng kết Tuần W${wIdx + 1}: Nạp ▲${r1(totalU)}h | Tiêu ▼${r1(totalD)}h | Cán cân: ${totalU - totalD >= 0 ? '+' : ''}${r1(totalU - totalD)}h. Quỹ 168h: ${r1(al(wIdx))}h.`;
  navigator.clipboard.writeText(text).then(() => {
    showToast("Đã sao chép tóm tắt vào bộ nhớ tạm!", "ok");
  });
}

function switchTab(tabId) {
  cur = tabId;
  draw(true);
}

function getThemePreference() {
  try { return localStorage.getItem("lc_theme") || "auto"; } catch (e) { return "auto"; }
}

function setThemePreference(mode) {
  const root = document.documentElement;
  if (mode === "auto") {
    root.removeAttribute("data-theme");
    try { localStorage.setItem("lc_theme", "auto"); } catch (e) {}
  } else {
    root.setAttribute("data-theme", mode);
    try { localStorage.setItem("lc_theme", mode); } catch (e) {}
  }
  renderSettingsModal();
}

function openSettingsModal() {
  LF = document.activeElement;
  renderSettingsModal();
  $("settingsModalOverlay").classList.add("open");
}

function closeSettingsModal() {
  const ov = $("settingsModalOverlay"), wasOpen = ov.classList.contains("open");
  ov.classList.remove("open");
  if (wasOpen && LF && LF.focus) {
    try { LF.focus(); } catch (e) {}
  }
}

function handleSettingsBackdropClick(e) {
  if (e.target.id === "settingsModalOverlay") closeSettingsModal();
}

function setDefaultDuration(val) {
  S.cfg = S.cfg || {};
  S.cfg.defDuration = Math.max(0.5, Math.min(24, val));
  save();
  showToast(`Đã lưu thời lượng mặc định: ${val}h`, "ok");
}

function setBurnoutThreshold(val) {
  S.cfg = S.cfg || {};
  S.cfg.burnoutHours = Math.max(1, Math.min(24, val));
  save();
  draw();
  showToast(`Đã lưu ngưỡng cảnh báo kiệt sức: ${val}h`, "ok");
}

function resetToDefaultData() {
  if (!confirm("⚠️ CẢNH BÁO NGUY HIỂM:\nBạn có chắc chắn muốn xóa TOÀN BỘ dữ liệu đã ghi và đưa ứng dụng về trạng thái ban đầu?\n\nKhuyến nghị: Hãy nhấn 'Xuất tệp sao lưu (.json)' trước khi xóa!")) return;
  if (!confirm("Xác nhận lần cuối: Mọi hoạt động ghi chép sẽ bị xóa vĩnh viễn trên thiết bị này. Tiếp tục?")) return;
  const keepLb = S.lb;
  S = defState();
  S.ev = {};
  S.lb = keepLb;
  save();
  draw(true);
  closeSettingsModal();
  showToast("Đã xóa toàn bộ hoạt động. Danh mục vốn được đặt lại mặc định.", "ok");
}

/* ==========================================================================

const V = {
  // --- TAB 1: LỊCH BIỂU (CALENDAR) ---
  ca() {
    const selWeekStart = W[sel];
    const selWeekEnd = ad(selWeekStart, 6);

    const headerBar = `
      ${reviewPrompt}
      <div class="card" style="margin-bottom:12px; padding:12px 16px;">
        <div class="card-header" style="margin-bottom:0">
          <div class="row">
            <button class="btn btn-sm" onclick="sel=Math.max(0, sel-1); draw()" title="Tuần trước">◀</button>
            <label style="font-weight:600; font-size:14px;">
              Tuần W${sel + 1} <span style="font-weight:400; color:var(--mu);">(${dateRangeStr})</span>
            </label>
            <button class="btn btn-sm" onclick="sel=Math.min(W.length - 1, sel + 1); draw()" title="Tuần sau">▶</button>
            ${CW >= 0 && sel !== CW ? `<button class="btn btn-sm btn-ghost" onclick="sel=Math.max(0, CW); draw()">Về tuần này (W${CW+1})</button>` : `<span class="pill pill-ok">Tuần hiện tại</span>`}
          </div>
          <div class="row">
            <div class="segmented-control">

            </div>
          </div>
        </div>
      </div>
    `;

    // 1. Chế độ TUẦN CHI TIẾT
    if (calSubView === "focus") {
      let cards = '<div class="week-cards-grid">';
      for (let j = 0; j < 7; j++) {
        const dt = ad(selWeekStart, j);
        const k = ky(dt);
        const isToday = k === tk;
        const es = S.ev[k] || [];
        const bat = getDayBattery(k);

        cards += `
          <div class="day-card ${isToday ? 'today' : ''}">
            <div class="day-card-header">
              <span class="day-name">${DN_VI[j]}</span>

            </div>
            <div class="day-battery-row">
              <span class="battery-badge ${bat.statusClass}">
                <span class="battery-icon"><span class="battery-fill" style="width:${bat.fillPercent}%"></span></span>
                ${bat.label}
              </span>
              ${bat.isBurnout ? `<span class="pill pill-bad" style="font-size:10px; padding:1px 5px;" title="Cảnh báo kiệt sức năng lượng!">Kiệt sức</span>` : ''}
            </div>
            <div class="day-events-list">
              ${es.length === 0 ? `<div style="color:var(--mu); font-size:12px; text-align:center; margin:auto 0; padding:12px 0;">Chưa có hoạt động</div>` : ""}

                const cap = CM(e.c);
                return `
                  <div class="event-item" style="border-left-color: ${cap.c}" onclick="openEditor('${k}', ${idx})">

                      <span class="event-title" title="${esc(e.t)}">${esc(e.t)}</span>

                    <div class="event-meta">
                      <span>${e.s ? e.s + ' · ' : ''}${r1(e.h)}h</span>
                      <span style="color:${cap.c}; font-weight:500;">${esc(cap.n)}</span>

      return headerBar + cards;

    // 2. Chế độ DÒNG THỜI GIAN 24H
    if (calSubView === "timeline") {
      const activeDate = ky(ad(selWeekStart, timelineDayIdx));
      const activeEvents = S.ev[activeDate] || [];
      const bat = getDayBattery(activeDate);
      const isViewingToday = activeDate === tk;

      const dayNav = `
        <div class="timeline-days-nav">
          ${[0, 1, 2, 3, 4, 5, 6].map(idx => {
            const d = ad(selWeekStart, idx);
            const dkStr = ky(d);
            const isSelected = idx === timelineDayIdx;
            const isToday = dkStr === tk;
            return `
              <button class="btn btn-sm ${isSelected ? 'btn-primary' : 'btn-ghost'}" onclick="timelineDayIdx=${idx}; draw();">
                ${DN_SHORT[idx]} ${d.getDate()}/${d.getMonth()+1} ${isToday ? '•' : ''}
              </button>
            `;
          }).join("")}
        </div>
      `;

      let hourMarkers = "";
      for (let h = 6; h <= 23; h++) {
        const topPx = (h - 6) * 48;
        hourMarkers += `<div class="timeline-hour-mark" style="top:${topPx}px;">${pad(h)}:00</div>`;
      }

      let eventBlocks = activeEvents.map((e, idx) => {
        if (!e.s) return "";
        const [hh, mm] = e.s.split(":").map(Number);
        const startFrom6 = (hh - 6) + (mm / 60);
        if (startFrom6 < 0 || startFrom6 > 18) return "";

        const topPx = startFrom6 * 48;
        const heightPx = Math.max(26, (e.h || 1) * 48);
        const cap = CM(e.c);

        return `
          <div class="timeline-event-block"
               style="top:${topPx}px; height:${heightPx}px; background:${cap.c};"
               onclick="openEditor('${activeDate}', ${idx})">
            <b>${e.s} – ${tt(e.s, e.h)}</b> · ${e.m === 'u' ? '▲' : '▼'} ${esc(e.t)} (${r1(e.h)}h)
          </div>

      }).join("");

      // Chỉ báo thời gian thực nếu đang xem ngày hôm nay
      let timeNowIndicator = "";
      if (isViewingToday) {
        const now = new Date();
        const curHr = now.getHours() + (now.getMinutes() / 60);
        if (curHr >= 6 && curHr <= 24) {
          const topNow = (curHr - 6) * 48;
          timeNowIndicator = `<div style="position:absolute; left:0; right:0; top:${topNow}px; height:2px; background:var(--bad); z-index:4; pointer-events:none;"><span style="position:absolute; right:4px; top:-9px; font-size:10px; font-weight:700; background:var(--bad); color:#fff; padding:1px 4px; border-radius:3px;">${pad(now.getHours())}:${pad(now.getMinutes())}</span></div>`;
        }
      }

      return headerBar + `
        <div class="timeline-container">
          ${dayNav}
          <div style="padding:10px 14px; background:var(--card); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bd);">
            <div>
              <b style="font-size:15px;">${DN_VI[timelineDayIdx]}, ${ad(selWeekStart, timelineDayIdx).toLocaleDateString("vi-VN")}</b>
              <span class="battery-badge ${bat.statusClass}" style="margin-left:8px;">
                <span class="battery-icon"><span class="battery-fill" style="width:${bat.fillPercent}%"></span></span>
                ${bat.label}
              </span>
            </div>
            <button class="btn btn-sm btn-primary" onclick="openEditor('${activeDate}')">+ Thêm hoạt động</button>
          </div>
          <div class="timeline-grid" onclick="handleTimelineGridClick(event, '${activeDate}')">
            ${hourMarkers}
            <div class="timeline-content-area">
              ${timeNowIndicator}
              ${eventBlocks}
            </div>
          </div>
        </div>
      `;
    }

    // 3. Chế độ LƯỚI 53 TUẦN (SỬA LỖI HOÀN CHỈNH)
    const pm = S.pm || "0";
    const st = pm === "all" ? 0 : pm === "4" ? Math.max(0, (CW >= 0 ? CW : 0) - 4) : (CW >= 0 ? CW : 0);

    const filterBar = `
      <div class="row" style="margin-bottom:12px; gap:8px;">
        <span style="font-size:12px; color:var(--mu);">Hiển thị:</span>
        <div class="segmented-control">
          ${[["0", "Từ tuần này"], ["4", "+ 4 tuần gần nhất"], ["all", "Tất cả " + W.length + " tuần"]].map(o =>
            `<button class="${pm === o[0] ? 'active' : ''}" onclick="S.pm='${o[0]}'; save(); draw(); scrollToCurrentWeek();">${o[1]}</button>`
          ).join("")}
        </div>
        <button class="btn btn-sm btn-ghost" onclick="scrollToCurrentWeek()">⟲ Về tuần hiện tại (W${CW >= 0 ? CW+1 : 1})</button>
      </div>
    `;

    let tbl = `<div class="table-wrapper" id="yearTableWrapper"><table class="calendar-table">
      <thead>
        <tr>
          <th style="width:50px">Năm</th>
          <th style="width:55px">Tuần</th>
          ${DN_SHORT.map(d => `<th>${d}</th>`).join("")}
          <th style="width:130px">▲ / ▼ · Tổng</th>
        </tr>
      </thead>
      <tbody>`;

    for (let i = st; i < W.length; i++) {
      const m = W[i];
      let u = 0, d = 0;
      evs(i).forEach(e => e.m === "u" ? u += e.h : d += e.h);
      const isCurWeek = i === CW;

      tbl += `<tr class="${isCurWeek ? 'current-week' : (CW >= 0 && i < CW) ? 'past-week' : ''}" id="${isCurWeek ? 'cw' : ''}">
        <td>${m.getFullYear()}</td>
        <td><b>W${i + 1}</b></td>`;

      for (let j = 0; j < 7; j++) {
        const dt = ad(m, j);

        const es = S.ev[k] || [];
        const isToday = k === tk;

        tbl += `<td class="cal-day-cell ${isToday ? 'is-today' : ''}" tabindex="0" onclick="openEditor('${k}')">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <small>${dt.toLocaleDateString("vi-VN", { month: "numeric", day: "numeric" })}</small>
            ${isToday ? '<span class="pill pill-ok" style="font-size:9px; padding:0 4px;">Nay</span>' : ''}

          ${es.map((e, idx) => `

      tbl += `<td style="font-size:12px;">

        <span style="font-weight:600; color:${tot > 168 ? 'var(--bad)' : 'var(--tx-sec)'}; margin-top:3px; display:inline-block;">

  // --- TAB 2: HIỆU SUẤT & 168 GIỜ & BÁNH XE CUỘC ĐỜI ---
  su() {
    const nn0 = Math.max(0, W.findIndex((_, i) => evs(i).length));
    const from = N === 0 ? Math.min(nn0, sel) : Math.max(0, sel - N + 1);
    const nn = sel - from + 1;
    const pf = from - nn;

    const avg = (k, a, b) => {
      let u = 0, d = 0;
      for (let i = a; i <= b; i++) {
        const w = wk(i, k);
        u += w.u;
        d += w.d;
      }
      const n = b - a + 1;
      return [u / n, d / n];
    };

    const D = S.caps.map(c => {
      const k = c.k;
      const s = wk(sel, k);
      const [au, ad_] = avg(k, from, sel);
      const pa = N && pf >= 0 ? avg(k, pf, from - 1)[0] : null;
      return {
        c,
        s,
        au,
        ad: ad_,
        pa,
        p: c.tg ? au / c.tg : null,
        sp: [...Array(8)].map((_, j) => sel - 7 + j).filter(i => i >= 0).map(i => [i, wk(i, k).u])
      };
    });

    const A = al(sel);
    const den = Math.max(168, A);
    const free = Math.max(0, 168 - A);
    const sg = S.caps.map(c => {
      const w = wk(sel, c.k);
      return { c, h: w.u + w.d };
    }).filter(x => x.h > 0);

    const selectorBar = `
      <div class="card" style="margin-bottom:12px; padding:12px 16px;">
        <div class="card-header" style="margin-bottom:0">
          <div class="row">

              ${W.map((m, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>Tuần W${i + 1} (${m.toLocaleDateString("vi-VN", { month: "numeric", day: "numeric" })})${i === CW ? ' - Hiện tại' : ''}</option>`).join("")}
            </select>
            <button class="btn btn-sm" onclick="sel=Math.min(W.length - 1, sel + 1); draw()">▶</button>

          </div>
          <div class="row">
            <button class="btn btn-sm btn-accent-olive" onclick="openWeeklyReviewModal(${sel})">🏆 Báo cáo tổng kết tuần</button>
            <select onchange="N=+this.value; draw()">
              <option value="4" ${N === 4 ? 'selected' : ''}>TB 4 tuần</option>
              <option value="8" ${N === 8 ? 'selected' : ''}>TB 8 tuần</option>
              <option value="0" ${N === 0 ? 'selected' : ''}>Tất cả tuần</option>
            </select>
          </div>
        </div>
      </div>

    // Nhận định thông minh (Native Insight Card)
    const T = D.filter(x => x.p != null);
    const okCount = T.filter(x => x.p >= 1).length;
    const worst = T.filter(x => x.p < 1).sort((a, b) => (b.c.tg - b.au) - (a.c.tg - a.au))[0];
    const drain = D.filter(x => x.ad > 0 && x.ad > x.au);
    const chip = x => x.p == null ? '<span class="pill pill-neutral">Chưa đặt</span>' : x.p >= 1 ? '<span class="pill pill-ok">Đạt</span>' : x.p >= .6 ? '<span class="pill pill-cyan">Gần đạt</span>' : '<span class="pill pill-bad">Thiếu</span>';

    const insightCard = `
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">💡 Nhận Định & Tình Trạng Các Loại Vốn</h2>
        </div>
        <p style="margin:4px 0 10px; font-size:13.5px; color:var(--tx-sec);">
          ${T.length ? `Đã có <b>${okCount}/${T.length}</b> nguồn vốn đạt mục tiêu tuần (trung bình ${nn} tuần gần nhất đến W${sel + 1}).` : "Chưa đặt mục tiêu cho vốn nào. Bạn có thể vào tab <b>Danh mục vốn</b> để đặt mục tiêu."}
          ${CW >= 0 && sel > CW ? " <i>(Đang xem kế hoạch tuần tương lai).</i>" : ""}
        </p>
        <div style="display:flex; flex-direction:column; gap:6px; font-size:13px;">
          ${worst ? `
            <div style="padding:8px 12px; background:var(--bad-soft); border-radius:var(--radius-sm); border-left:3.5px solid var(--bad);">
              ⚠️ <b>Cần bổ sung nhiều nhất:</b> Vốn <b>${esc(worst.c.n)}</b> chỉ đạt trung bình ${r1(worst.au)}h / ${r1(worst.c.tg)}h (thiếu <b>${r1(worst.c.tg - worst.au)}h/tuần</b>).
            </div>
          ` : ''}
          ${drain.length ? `
            <div style="padding:8px 12px; background:var(--wa-soft); border-radius:var(--radius-sm); border-left:3.5px solid var(--wa);">
              ⚡ <b>Đang tiêu hao nhiều hơn nạp:</b> ${drain.map(x => `<b>${esc(x.c.n)}</b> (tiêu ${r1(x.ad)}h > nạp ${r1(x.au)}h)`).join(", ")}.

    const wheelCard = `

            <div class="card-sub">Trực quan hóa mức độ tròn trịa và cân bằng giữa ${S.caps.length} loại vốn trong tuần W${sel + 1}.</div>
          </div>
        </div>
        ${renderRadarChartSVG(sel)}
      </div>
    `;

    const pc = h => Math.round(h / 168 * 100);
    const f168 = `
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Khung 168 Giờ · Tuần W${sel + 1}</h2>
            <div class="card-sub">Tổng quỹ chuẩn: 168h (24 giờ × 7 ngày)</div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:12px;">
          <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
            <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Đã phân bổ</div>
            <div style="font:700 22px Georgia, serif; margin-top:2px;">${r1(A)}h <span style="font-size:13px; font-weight:400; color:var(--mu);">(${pc(A)}%)</span></div>
          </div>
          <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">

              ${A > 168 ? '+' + r1(A - 168) + 'h' : r1(free) + 'h'}
              <span style="font-size:13px; font-weight:400; color:var(--mu);">${A > 168 ? '(vượt mức)' : `(${pc(free)}%)`}</span>

/* ==========================================================================
   9. MODAL EDITOR (THÊM / SỬA HOẠT ĐỘNG TRONG NGÀY)
   ========================================================================== */
let LFi = -1, TPL = [];
const FOC = "#v button,#v input,#v select,#v [tabindex]";
let LF = null; // Ghi nhớ element được focus trước khi mở modal

function openEditor(dateStr, editIndex = null) {
  LF = document.activeElement;
  LFi = [...document.querySelectorAll(FOC)].indexOf(LF);
  ed = dateStr;
  ei = editIndex;
  renderEditorSheet();
  $("modalOverlay").classList.add("open");
  setTimeout(() => {
    const inp = $("inpTitle");
    if (inp) {
      inp.focus();
      if (ei != null) inp.select();
    }
  }, 100);
}

function closeEditor() {
  $("modalOverlay").classList.remove("open");
  ed = null;
  ei = null;
  restoreFocus();
}

function restoreFocus() {
  if (LF && LF.isConnected && LF.focus) { try { LF.focus(); return; } catch (e) {} }
  const el = [...document.querySelectorAll(FOC)][LFi];
  if (el) el.focus();
}

function handleBackdropClick(e) {
  if (e.target.id === "modalOverlay") closeEditor();
}

function deleteCurrentEvent() {
  if (ei == null || !ed || !S.ev[ed] || !S.ev[ed][ei]) return;
  if (!confirm("Bạn có chắc chắn muốn xóa hoạt động này?")) return;
  const delTitle = S.ev[ed][ei].t;
  S.ev[ed].splice(ei, 1);
  if (!S.ev[ed].length) delete S.ev[ed];
  ei = null;
  save();
  draw();
  closeEditor();
  showToast(`Đã xóa "${delTitle}"`, "ok");
}

function tpls() {
  const m = {};
  Object.values(S.ev).forEach(l => l.forEach(e => {
    const n = e.t.trim().toLowerCase();
    const x = m[n] = m[n] || { n: 0, e };
    x.n++;
    x.e = e;
  }));
  return Object.values(m).sort((a, b) => b.n - a.n).slice(0, 6).map(x => x.e);
}

function fillTpl(i) {
  const item = TPL[i];
  if (!item) return;
  const tInp = $("inpTitle");
  const cInp = $("inpCap");
  const mInp = $("inpMode");
  const hInp = $("inpHours");
  if (tInp) tInp.value = item.t;
  if (cInp) cInp.value = item.c;
  if (mInp) mInp.value = item.m;
  if (hInp) hInp.value = item.h;
  if (tInp) tInp.focus();
}

function rep(date, o, rp, end) {
  const r = "r" + Date.now().toString(36);
  const a = new Date(date + "T00:00");
  const z = new Date((end || activeYear + "-12-31") + "T00:00");
  const days = [];
  for (let d = a; d <= z && days.length < 400; d = ad(d, 1)) {
    const g = d.getDay();
    if (rp === "d" || (rp === "wd" && g > 0 && g < 6) || (rp === "w" && g === a.getDay())) {
      days.push(ky(d));
    }
  }
  if (!days.length) {
    showToast("Không tạo được chuỗi lặp: hãy kiểm tra ngày kết thúc.", "bad");
    return 0;
  }
  const bad = o.s ? days.filter(k => chkEvent(k, o.s, o.h, -1).hit).length : 0;
  if (bad && !confirm(`${bad} ngày trong chuỗi bị trùng giờ với hoạt động khác. Vẫn tạo chuỗi?`)) return 0;
  days.forEach(k => {
    S.ev[k] = S.ev[k] || [];
    S.ev[k].push({ ...o, r });
    sortL(S.ev[k]);
  });
  return days.length;
}

function delSeries(i) {
  if (!ed || !S.ev[ed] || !S.ev[ed][i]) return;
  const r = S.ev[ed][i].r;
  if (!r || !confirm("Xóa tất cả hoạt động của chuỗi này từ ngày này trở đi?")) return;
  Object.keys(S.ev).forEach(k => {
    if (k >= ed) {
      S.ev[k] = S.ev[k].filter(e => e.r !== r);
      if (!S.ev[k].length) delete S.ev[k];
    }
  });
  ei = null;
  save();
  draw();
  closeEditor();
  showToast("Đã xóa chuỗi hoạt động định kỳ", "ok");
}

function handleTitleKeydown(e) {
  if (e.isComposing) return;
  if (e.key === "Enter") {
    e.preventDefault();
    const startInp = $("inpStart");
    if (startInp) startInp.focus();
  }
}

function handleTitleInput(val) {
  const guessedCap = guess(val);
  const select = $("inpCap");
  if (select && S.caps.some(c => c.k === guessedCap)) {
    select.value = guessedCap;
  }
}

function adjustHours(delta) {
  const inp = $("inpHours");
  if (!inp) return;
  const current = parseFloat(inp.value) || 2;
  inp.value = Math.max(0.5, Math.min(24, Math.round((current + delta) * 10) / 10));
}

  const quickTpls = !X ? tpls() : [];

  let html = `

      ${!X && quickTpls.length > 0 ? `

          ${quickTpls.map((p, idx) => `
            <button type="button" class="btn btn-sm btn-ghost"

            </button>
          `).join("")}
        </div>
      ` : ''}

      <div class="form-group">
        <label class="form-label" for="inpTitle">Tên hoạt động <span style="color:var(--bad)">*</span></label>
        <input id="inpTitle" placeholder="Ví dụ: Đánh cầu lông, Đọc sách, Họp nhóm, Chạy bộ..."
               value="${X ? esc(X.t) : ''}"
               oninput="handleTitleInput(this.value)"
               onkeydown="handleTitleKeydown(event)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="inpCap">Loại vốn</label>
          <select id="inpCap">
            ${S.caps.map(c => `<option value="${c.k}" ${X && X.c === c.k ? 'selected' : ''}>${esc(c.n)}</option>`).join("")}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="inpMode">Tác động năng lượng</label>
          <select id="inpMode">
            <option value="u" ${!X || X.m === 'u' ? 'selected' : ''}>▲ Nạp / Tái tạo vốn</option>
            <option value="d" ${X && X.m === 'd' ? 'selected' : ''}>▼ Tiêu / Rút vốn</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="inpStart">Giờ bắt đầu</label>
          <input id="inpStart" type="time" value="${defaultStartTime}">
        </div>

        <div class="form-group">
          <label class="form-label" for="inpHours">Thời lượng (giờ)</label>
          <div style="display:flex; align-items:center; gap:6px;">
            <button type="button" class="btn btn-sm" onclick="adjustHours(-0.5)" style="padding:5px 8px;">-0.5</button>
            <input id="inpHours" type="number" step="0.5" min="0.5" max="24" value="${X ? X.h : defaultDuration}" style="flex:1; text-align:center;">
            <button type="button" class="btn btn-sm" onclick="adjustHours(0.5)" style="padding:5px 8px;">+0.5</button>
          </div>
        </div>
      </div>

      ${X ? (X.r ? `
        <div style="padding:6px 10px; background:var(--card-subtle); border-radius:var(--radius-sm); border:1px solid var(--bd);">
          <label style="font-size:12.5px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="inpSeries">
            <b>Áp dụng thay đổi cho cả chuỗi</b> từ ngày này trở đi
          </label>
        </div>
      ` : '') : `
        <div class="form-row" style="background:var(--card-subtle); padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--bd);">

  `;

  $("sheetBody").innerHTML = html;
