/* ---- Timeline: mỗi mục một dòng, buổi là vạch trong thanh của mục ---- */
function pjTimelineHTML(p, items) {
  const z = pjPref.z || "w", dw = { d: 30, w: 12, m: 4 }[z];
  const dates = [p.sd, p.ed, tk, ...(p.ms || []).map(m => m.d)];
  items.forEach(i => dates.push(i.first, i.last, i.kind === "task" ? i.due : ""));
  const ds = dates.filter(Boolean).sort(), padD = { d: 3, w: 7, m: 21 }[z];
  const start = ky(ad(new Date(ds[0] + "T00:00"), -padD)), end = ky(ad(new Date(ds[ds.length - 1] + "T00:00"), padD));
  const days = dayDiff(start, end) + 1, W2 = days * dw, x = k => dayDiff(start, k) * dw;
  let grid = "", top = "", bot = "";
  // Nhãn tháng ở đầu trục chỉ hiện khi còn đủ chỗ trước ngày 1 của tháng kế tiếp, tránh chồng chữ
  const s0 = new Date(start + "T00:00"), gap0 = (new Date(s0.getFullYear(), s0.getMonth() + 1, 1) - s0) / 864e5 * dw;
  for (let i = 0; i < days; i++) {
    const d = ad(new Date(start + "T00:00"), i), k = ky(d), L = i * dw, mon = d.getDay() === 1, d1 = d.getDate() === 1 || (i === 0 && gap0 >= 64);
    if (z === "d") {
      top += `<span class="tl-lb ${d.getDay() % 6 === 0 ? "we" : ""}" style="left:${L}px; width:${dw}px">${d.getDate()}</span>`;
      if (mon) grid += `<i class="tl-gl" style="left:${L}px"></i>`;
      if (d1) bot += `<span class="tl-mo" style="left:${L}px">Th${d.getMonth() + 1}/${d.getFullYear()}</span>`;
    } else if (z === "w") {
      if (mon) { grid += `<i class="tl-gl" style="left:${L}px"></i>`; top += `<span class="tl-lb" style="left:${L}px">${dm(k)}</span>`; }
      if (d1) bot += `<span class="tl-mo" style="left:${L}px">Th${d.getMonth() + 1}${d.getMonth() === 0 || i === 0 || L < 64 ? "/" + d.getFullYear() : ""}</span>`;
    } else {
      if (d1) { grid += `<i class="tl-gl" style="left:${L}px"></i>`; top += `<span class="tl-lb" style="left:${L}px">Th${d.getMonth() + 1}</span>`; }
      if (d1 && (d.getMonth() === 0 || L < 64)) bot += `<span class="tl-mo" style="left:${L}px">${d.getFullYear()}</span>`;
    }
  }
  const mark = (k, cls, title) => k >= start && k <= end ? `<i class="${cls}" style="left:${x(k) + (cls === "tl-today" ? dw / 2 : 0)}px" title="${title}"></i>` : "";
  grid += mark(tk, "tl-today", "Hôm nay") + mark(p.sd, "tl-edge", "Bắt đầu dự án") + (p.ed ? mark(ky(ad(new Date(p.ed + "T00:00"), 1)), "tl-edge", "Kết thúc dự án") : "");
  const row = it => {
    const c = CM(it.c) || { c: "var(--mu)", n: "" };
    let track = "";
    if (it.evs.length) {
      const L = x(it.first), R = x(it.last) + dw;
      track += `<button type="button" class="tl-bar" style="left:${L}px; width:${Math.max(dw, R - L)}px" onclick="pjOpenItem('${it.kind}','${it.id}')" aria-label="${esc(it.t)}: ${dm(it.first)} – ${dm(it.last)}"></button>`;
      track += it.evs.map(v => {
        const min = v.e.s ? toMin(v.e.s) : 0, left = x(v.k) + (z === "d" && v.e.s ? min / 1440 * dw : z === "d" ? 0 : dw * 0.15);
        const w = Math.max(3, z === "d" ? (v.e.s ? v.e.h / 24 : 1) * dw : dw * 0.7);

function pjOverviewHTML(p, items) {

  return `

      <div class="pjo-col">${cSt}${cAt}${cDe}</div>

function pjUpSave() {

}
function pjMsAdd() {

function pjMsToggle(id) {

}
function pjMsDel(id) {

/* ---- Thao tác trên mục và phần ---- */
function pjAddTask(el) {
  const p = findPj(pjOpenId), title = String(el.value || "").trim();
  if (!p || !title) return;
  el.value = ""; // xóa ngay: Enter thừa của bộ gõ (nếu có) gặp ô trống thì không thêm lần nữa
  const sec = el.dataset.sec || "";
  S.tasks.unshift({ id: nid("t"), t: title.slice(0, 160), c: pjCap(p, guess(title)), m: "u", subs: [], pj: p.id, ...(sec ? { sec } : {}) });
  save(); draw();
  showToast(`Đã thêm "${title.slice(0, 40)}"`, "ok");
  pjFocus(el.id);
}
function pjToggleTask(id) {
  const t = findTask(id);
  if (!t) return;
  const was = taskDone(t), before = { done: t.done, subs: t.subs.map(s => s.done) };
  if (t.subs.length) t.subs.forEach(s => { if (was) delete s.done; else s.done = 1; });
  else if (was) delete t.done; else t.done = 1;
  save(); draw();
  if (!was) offerUndo(`Đã xong "${t.t}"`, () => {
    const x = findTask(id);
    if (!x) return;
    if (before.done) x.done = before.done; else delete x.done;
    x.subs.forEach((s, i) => { if (before.subs[i]) s.done = before.subs[i]; else delete s.done; });
  }, []);
}
function pjSetSec(kind, id, sec) {
  const p = findPj(pjOpenId);
  if (!p) return;
  if (sec === "-") sec = "";
  if (kind === "task") {
    const t = findTask(id);
    if (!t) return;
    if (sec) t.sec = sec; else delete t.sec;
  } else {
    const it = pjModel(p).find(i => i.kind === "ser" && i.id === id);
    if (!it) return;
    it.evs.forEach(({ e }) => { if (sec) e.sec = sec; else delete e.sec; });
  }
  save(); draw();
}
function pjSetDue(id, v) {
  const t = findTask(id);
  if (!t) return;
  if (v && dateOk(v)) t.due = v; else delete t.due;
  save(); draw();
}
function pjDragStart(ev, kind, id) {
  pjDrag = { kind, id };
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", id); } catch (e) {}
}
function pjOver(ev) { if (!pjDrag) return; ev.preventDefault(); ev.currentTarget.classList.add("pj-over"); }
function pjLeave(ev) { if (!ev.currentTarget.contains(ev.relatedTarget)) ev.currentTarget.classList.remove("pj-over"); }
function pjDrop(ev, sec) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("pj-over");

  pjDrag = null;

}

/* ---- Bảng chi tiết của một mục ---- */

// Giờ từng tuần của dự án (tối đa 26 tuần gần nhất), cột tuần này tô đậm
function pjWeeksHTML(p, evs) {
  const startK = monKey([p.sd, evs[0].k].sort()[0]);
  const lastK = [evs[evs.length - 1].k, tk].sort().pop();
  const nowW = monKey(tk);
  let weeks = [];
  for (let k = startK; k <= lastK; k = ky(ad(new Date(k + "T00:00"), 7))) weeks.push({ k, h: 0 });
  if (weeks.length > 26) weeks = weeks.slice(-26);
  const idx = new Map(weeks.map((w, i) => [w.k, i]));
  evs.forEach(({ k, e }) => { const i = idx.get(monKey(k)); if (i != null) weeks[i].h += e.h; });
  const max = Math.max(1, ...weeks.map(w => w.h));
  return `
    <div class="pj-weeks" aria-label="Giờ theo tuần">
      <div class="pj-wk-bars">${weeks.map(w => `<span class="pj-wk ${w.k === nowW ? "now" : ""}" title="Tuần ${dm(w.k)}: ${r1(w.h)}h"><i style="height:${Math.round(w.h / max * 100)}%"></i></span>`).join("")}</div>
      <div class="pj-wk-axis"><span>${dm(weeks[0].k)}</span><span>Giờ mỗi tuần · cao nhất ${r1(max)}h</span><span>${dm(weeks[weeks.length - 1].k)}</span></div>
    </div>`;
}

async function deleteProject(id) {
  const p = findPj(id);
  if (!p) return;
  const evs = pjEvents(id), tasks = S.tasks.filter(t => t.pj === id);
  const a = await ask({ title: `Xóa dự án "${p.n}"?`, msg: `${evs.length} hoạt động và ${tasks.length} việc vẫn giữ nguyên, chỉ bỏ nhãn dự án.`, ok: "Xóa dự án", danger: true });
  if (a !== "ok") return;
  const idx = S.projects.indexOf(p);
  S.projects.splice(idx, 1);
  const evObjs = evs.map(x => x.e);
  evObjs.forEach(e => { delete e.pj; markPending(e); });
  tasks.forEach(t => delete t.pj);
  if (pjOpenId === id) {
    pjOpenId = null;
    pjCloseItem();
    try { if (history.state && history.state.pj) history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  save();
  gcalFlush();
  closeProject();
  draw();
  offerUndo(`Đã xóa dự án "${p.n}"`, () => {
    S.projects.splice(Math.min(idx, S.projects.length), 0, p);
    evObjs.forEach(e => { e.pj = id; markPending(e); });
    tasks.forEach(t => { t.pj = id; });
  }, []);
}

function pjPicked(id) {
  const p = findPj(id), sel2 = $("inpCap");
  if (!sel2) return;
  const order = p ? p.caps : [];
  [...sel2.options].sort((a, b) => {
    const ia = order.indexOf(a.value), ib = order.indexOf(b.value);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || S.caps.findIndex(c => c.k === a.value) - S.caps.findIndex(c => c.k === b.value);
  }).forEach(o => sel2.appendChild(o));
  if (p && !capTouched && p.caps[0]) sel2.value = p.caps[0];
}

/* ---- Ô ghi nhanh: #dự án ---- */
// Tách "#tên" khỏi câu. Trả về dự án khớp (ưu tiên khớp đầu tên, dự án đang mở), phần câu còn lại, và từ khóa đã gõ.
function takeProject(str) {
  const m = /(^|\s)#([^\s#]*)/u.exec(str || "");
  if (!m) return { rest: str, pj: null, q: null };
  const q = m[2], fq = fold(q);
  const rest = (str.slice(0, m.index) + m[1] + str.slice(m.index + m[0].length)).replace(/\s{2,}/g, " ").trim();
  if (!fq) return { rest, pj: null, q };
  const cands = (S.projects || []).map(p => ({ p, f: fold(p.n) })).filter(x => x.f.includes(fq));
  cands.sort((a, b) => (b.f.startsWith(fq) - a.f.startsWith(fq)) || (pjIsOpen(b.p) - pjIsOpen(a.p)) || pjCmp(a.p, b.p));
  return { rest, pj: cands.length ? cands[0].p : null, q };
}
// Gợi ý khi đang gõ "#..." ở cuối câu
function pjSuggestList(val) {
  const m = /(^|\s)#([^\s#]*)$/u.exec(val || "");
  if (!m) return null;
  const fq = fold(m[2]);
  return { m, list: (S.projects || []).filter(p => pjIsOpen(p) && fold(p.n).includes(fq)).sort(pjCmp).slice(0, 5) };
}
function pjSuggestHTML(val) {
  const sl = pjSuggestList(val);
  if (!sl) return "";
  const { m, list } = sl;

/* ==========================================================================
   THÓI QUEN (v0.6.0, thêm trong UAT 20/10)
   S.habits: [{ id, n, c (vốn), kind: "auto" (tự đếm buổi cùng tên trên lịch) | "tick" (tích tay),
               key (tên hoạt động đã bỏ dấu, chỉ auto), per: "week" (tgt lần/tuần) | "day" (mỗi ngày, nghỉ 1 ngày/tuần),

   Chuỗi kiểu mềm: theo tuần thì đếm số tuần liên tiếp đạt; mỗi ngày thì mỗi tuần được nghỉ 1 ngày không đứt chuỗi.

const HB_MS = { day: [7, 21, 30, 66, 100, 200, 365], week: [4, 8, 12, 26, 52] };
const hbFoldM = new Map();
function hbFold(t) {

  return v;

const hbKey = h => h.key || fold(h.n);

const findHb = id => (S.habits || []).find(h => h.id === id);

// Các ngày đã làm

// Chuỗi hiện tại, kỷ lục, số lần tuần này
function hbStats(h, days = hbDays(h)) {
  const today = tk, list = [...days].filter(k => k <= today).sort(), wk0 = monKey(today);
  // chỉ tính ngày đã qua và hôm nay: buổi đã xếp cho những ngày tới chưa phải là đã làm
  const weekCount = w => { let n = 0; for (let j = 0; j < 7; j++) { const k = ky(ad(new Date(w + "T00:00"), j)); if (k <= today && days.has(k)) n++; } return n; };
  const thisWeek = weekCount(wk0);
  let cur = 0, best = 0;
  if (list.length) {

        if (weekCount(w) >= h.tgt) cur++;
        else if (w !== wk0) cur = 0;

    } else {
      let miss = new Map();
      for (let d = new Date(list[0] + "T00:00"), k = list[0]; k <= today; d = ad(d, 1), k = ky(d)) {

  const need = h.per === "week" ? Math.max(0, h.tgt - thisWeek) : 0;

}
function hbDots(h, days, wk0, tickable) {
  return [0, 1, 2, 3, 4, 5, 6].map(j => {
    const k = ky(ad(new Date(wk0 + "T00:00"), j)), on = days.has(k), cls = `${on ? "on" : ""} ${k === tk ? "today" : ""} ${k > tk ? "fut" : ""}`;
    const lb = `${DN_SHORT[j]} ${dm(k)}: ${k > tk ? (on ? "đã xếp lịch" : "chưa tới") : on ? "đã làm" : "chưa làm"}`;
    return tickable && k <= tk

// Gợi ý: hoạt động có từ 3 ngày trở lên trong 14 ngày qua, chưa là thói quen, chưa bị bỏ qua trên máy này

  for (let j = 0; j < 14; j++) {
    const k = ky(ad(new Date(tk + "T00:00"), -j));
    (S.ev[k] || []).forEach(e => {
      const f = hbFold(e.t);
      if (!f || keys.has(f) || dis.has(f)) return;
      const x = seen.get(f) || { names: new Map(), c: e.c, days: new Set() };
      x.days.add(k);

        <div class="row" style="gap:6px;">
          <button type="button" class="btn btn-ghost" onclick="closeHb()">Hủy</button>
          <button type="button" class="btn btn-primary" id="hbSave" onclick="hbSave()">${h ? "Lưu" : "Thêm"}</button>
        </div>
      </div>
    </div>`;
}
function hbSave() {
  if (!hbEd) return;
  const d = hbEd.d, n = (($("hbName") || {}).value || d.n || "").trim();
  if (!n) { showToast("Nhập tên thói quen", "bad"); const i = $("hbName"); if (i) i.focus(); return; }
  const match = d.kind === "auto" ? ((($("hbMatch") || {}).value || d.match || n).trim()) : "";
  const key = d.kind === "auto" ? fold(match) : "";
  if (d.kind === "auto" && !key) { showToast("Nhập tên hoạt động để đếm", "bad"); return; }
  const dup = key && (S.habits || []).find(x => x.id !== hbEd.id && x.kind === "auto" && hbKey(x) === key);
  if (dup) { showToast(`"${dup.n}" đã theo dõi hoạt động này`, "bad"); return; }
  let h = hbEd.id ? findHb(hbEd.id) : null;
  if (!h) h = hbAdd({ ...d, n, match });
  else {
    Object.assign(h, { n: n.slice(0, 60), c: d.c, kind: d.kind, per: d.per, tgt: d.per === "day" ? 7 : d.tgt });
    if (d.kind === "auto") h.key = key; else delete h.key;
    h.ticks = h.ticks || {};
  }
  save(); closeHb(); draw();
  showToast(hbEd === null ? `Đã lưu "${h.n}"` : "Đã lưu", "ok");
}
function hbArchive(id) {
  const h = findHb(id);
  if (!h) return;
  if (h.arch) delete h.arch; else h.arch = 1;
  save(); closeHb(); draw();
  showToast(h.arch ? `Đã lưu trữ "${h.n}"` : `Đang theo dõi lại "${h.n}"`, "ok");
}
function hbDelete(id) {
  const i = (S.habits || []).findIndex(h => h.id === id);
  if (i < 0) return;
  const h = S.habits[i];
  S.habits.splice(i, 1);
  save(); closeHb(); draw();
  offerUndo(`Đã xóa thói quen "${h.n}"`, () => { if (!findHb(h.id)) S.habits.splice(Math.min(i, S.habits.length), 0, h); });
}
// Thói quen tự đếm còn thiếu lần trong tuần: mở popup thêm hoạt động ở khoảng trống sớm nhất
function hbPlanOne(id) {
  const h = findHb(id);
  if (!h) return;
  const key = hbKey(h), past = [];
  Object.keys(S.ev).forEach(k => S.ev[k].forEach(e => { if (hbFold(e.t) === key) past.push(e.h); }));
  past.sort((a, b) => a - b);
  const dur = past.length ? past[past.length >> 1] : 1, c = schCfg(), days = hbDays(h);
  const left = 7 - dow(new Date(tk + "T00:00"));
  let at = null;
  for (let j = 0; j < Math.max(left, 1) + 7 && !at; j++) {
    const k = ky(ad(new Date(tk + "T00:00"), j));
    if (days.has(k)) continue;
    const g = gapAt(k, k === tk ? Math.max(c.from, nowMin()) : c.from, c.to, dur, new Set());
    if (g != null) at = { k, s: hmOf(g) };
  }
  if (!at) { showToast("Không còn khoảng trống trong tuần", "bad"); return; }
  const title = hbMatchTitle(h);
  closeHb();
  openEditor(at.k);
  capTouched = true;
  $("inpTitle").value = title;
  $("inpCap").value = h.c;
  $("inpStart").value = at.s;
  $("inpHours").value = dur;
}
// Tổng kết tuần, Tổng quan: mỗi thói quen một dòng
let hbShowArch = false;
function hbManageHTML() {
  const L = hbList(), A = hbList(true);
  const row = h => { const st = hbStats(h); return `
    <div class="hb-row" style="--cap:${CM(h.c).c}">
      <span class="dot" style="background:${CM(h.c).c}"></span>
      <b class="hb-row-n">${esc(h.n)}</b>
      <span class="hb-row-st">${h.kind === "auto" ? "Tự đếm" : "Tích tay"} · ${h.per === "week" ? `${h.tgt} lần/tuần` : "mỗi ngày"} · chuỗi ${st.cur} ${hbUnit(h)} · kỷ lục ${st.best}</span>
      <button type="button" class="btn btn-sm" onclick="hbOpen('${h.id}')">Sửa</button>
    </div>`; };
  return `
    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <div><h2 class="card-title">Thói quen</h2><div class="card-sub">Mỗi thói quen thuộc một loại vốn; tự đếm các buổi cùng tên trên lịch hoặc tích tay</div></div>
        <button type="button" class="btn btn-primary btn-sm" onclick="hbOpen()">Thêm thói quen</button>
      </div>
      ${L.length ? `<div class="hb-rows">${L.map(row).join("")}</div>` : `<p style="color:var(--mu); font-size:13px; margin:0;">Chưa có thói quen. Ghi một hoạt động vài lần, app sẽ gợi ý trên tab Lịch.</p>`}
      ${A.length ? `<button type="button" class="btn btn-sm btn-ghost" style="margin-top:8px;" onclick="hbShowArch = !hbShowArch; draw()">${hbShowArch ? "Ẩn" : "Xem"} đã lưu trữ (${A.length})</button>${hbShowArch ? `<div class="hb-rows hb-arch">${A.map(row).join("")}</div>` : ""}` : ""}
    </div>`;
}
function hbWeekRowsHTML(ws) {
  const L = hbList();
  if (!L.length) return "";
  const w0 = ky(ws);
  return `<div class="hb-rows">${L.map(h => {
    const st = hbStats(h);
    let n = 0;
    for (let j = 0; j < 7; j++) { const k = ky(ad(ws, j)); if (k <= tk && st.days.has(k)) n++; }
    const goal = h.per === "week" ? h.tgt : 6, ok = n >= goal;
    return `<div class="hb-row" style="--cap:${CM(h.c).c}">
      <span class="dot" style="background:${CM(h.c).c}"></span>
      <b class="hb-row-n">${esc(h.n)}</b>
      <span class="${ok ? "hb-ok" : w0 < monKey(tk) ? "hb-miss" : ""}">${n}/${h.per === "week" ? h.tgt + " lần" : "7 ngày"}</span>
      <span class="hb-row-st">chuỗi ${st.cur} ${hbUnit(h)} · kỷ lục ${st.best}</span>
    </div>`;
  }).join("")}</div>`;
}
function hbDemo() {
  if ((S.habits || []).some(h => h.demo)) return;
  const sk = S.caps.some(c => c.k === "sk") ? "sk" : (S.caps[0] || {}).k;
  if (!sk) return;
  S.habits = S.habits || [];
  const ticks = {};
  for (let j = 1; j <= 20; j++) if (j % 6) ticks[ky(ad(new Date(tk + "T00:00"), -j))] = 1;
  // 3 tuần trước mỗi tuần 2 buổi Chạy bộ: chuỗi mẫu 3 tuần
  const m0 = new Date(monKey(tk) + "T00:00");
  [-21, -19, -14, -11, -7, -5].forEach(n => { const k = ky(ad(m0, n)), L = S.ev[k] = S.ev[k] || []; if (!L.some(e => e.t === "Chạy bộ")) { L.push({ t: "Chạy bộ", c: sk, m: "u", h: 1, s: "06:30", demo: 1 }); sortL(L); } });
  S.habits.push({ id: nid("h"), n: "Chạy bộ", c: sk, kind: "auto", key: fold("Chạy bộ"), per: "week", tgt: 2, ticks: {}, sd: tk, demo: 1 },
                { id: nid("h"), n: "Uống đủ nước", c: sk, kind: "tick", per: "day", tgt: 7, ticks, sd: tk, demo: 1 });
}

// Khởi chạy ứng dụng
(() => { // mở thẳng một dự án qua địa chỉ #pj/<mã>; nút Quay lại về danh sách dự án
  const m = /^#pj\/([\w-]{1,24})$/.exec(location.hash);
  if (!m) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  if (findPj(m[1])) pjOpen(m[1]);
})();
draw(true);
gcalFlush(); // đẩy các thay đổi còn chờ từ lần mở trước
cloudInit(); // đã đăng nhập đồng bộ: tải thư viện, nhận phiên, đồng bộ lần đầu
try {
  if (!localStorage.getItem("lc_onb") && !Object.keys(S.ev).length && !S.tasks.length) setTimeout(onbStart, 500);
} catch (e) {}
</script>
