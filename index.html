<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Life Capital · Quản trị Năng lượng & Thời gian 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Capital">
<meta name="theme-color" content="#E0A3BB">
<style>
/* ==========================================================================
   BẢNG MÀU CHỦ ĐẠO & BỔ TRỢ:
   - Màu chủ đạo: #E0A3BB (Mauve Rose)
   - Màu bổ trợ:
     * #F4DFE6 (Blush Soft)
     * #D6E6E7 (Mist Cyan)
     * #C5CC82 (Sage Light Olive)
     * #97A13B (Deep Olive Green)
   - Nền web pha thêm 5% màu trắng để sáng và thông thoáng hơn
   ========================================================================== */
:root {
  --ac: #E0A3BB;               /* Màu chủ đạo: Mauve Rose */
  --ac-hover: #d28faa;
  --ac-soft: rgba(224, 163, 187, 0.22);
  --ac-dark: #642841;          /* Chữ tương phản cao */

  /* Màu bổ trợ */
  --c-blush: #F4DFE6;          /* Bổ trợ 1: Hồng phấn nhạt */
  --c-cyan: #D6E6E7;           /* Bổ trợ 2: Xanh ngọc mây nhạt */
  --c-sage: #C5CC82;           /* Bổ trợ 3: Xanh xám oliu sáng */
  --c-olive: #97A13B;          /* Bổ trợ 4: Xanh oliu đậm */

  /* Nền web pha thêm 5% màu trắng */
  --bg: #fdfcfd;
  --bg-color-mixed: color-mix(in srgb, #faf7f8 95%, #ffffff 5%);
  --card: #ffffff;
  --card-subtle: #fcf8fa;
  --tx: #251d21;
  --tx-sec: #594d53;
  --mu: #85767d;
  --bd: #ebdde2;
  --bd-focus: #E0A3BB;
  --bar: #F4DFE6;              /* Thanh tiến trình / track nền */

  --ok: #97A13B;               /* Nạp năng lượng ▲ (Olive đậm) */
  --ok-soft: rgba(197, 204, 130, 0.28);
  --bad: #c24d5b;              /* Rút năng lượng ▼ */
  --bad-soft: rgba(224, 163, 187, 0.25);
  --wa: #b87b1e;
  --wa-soft: rgba(184, 123, 30, 0.15);
  --hd: #642841;               /* Header bảng */

  --shadow-sm: 0 1px 3px rgba(100, 40, 65, 0.04);
  --shadow-md: 0 4px 14px rgba(100, 40, 65, 0.07);
  --shadow-lg: 0 12px 32px rgba(100, 40, 65, 0.14);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151113;
    --card: #1f191c;
    --card-subtle: #292125;
    --tx: #f8eff3;
    --tx-sec: #b9abb2;
    --mu: #94858d;
    --ac: #E0A3BB;
    --ac-hover: #ebbcd0;
    --ac-soft: rgba(224, 163, 187, 0.2);
    --ac-dark: #fcebf2;

    --c-blush: #34262c;
    --c-cyan: #223436;
    --c-sage: #383e22;
    --c-olive: #C5CC82;

    --bd: #3d2f36;
    --bar: #2e2328;
    --ok: #C5CC82;
    --ok-soft: rgba(197, 204, 130, 0.2);
    --bad: #ea6b77;
    --bad-soft: rgba(234, 107, 119, 0.2);
    --hd: #431a2b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);
  }
}

:root[data-theme="dark"] {
  --bg: #151113;
  --card: #1f191c;
  --card-subtle: #292125;
  --tx: #f8eff3;
  --tx-sec: #b9abb2;
  --mu: #94858d;
  --ac: #E0A3BB;
  --ac-hover: #ebbcd0;
  --ac-soft: rgba(224, 163, 187, 0.2);
  --ac-dark: #fcebf2;

  --c-blush: #34262c;
  --c-cyan: #223436;
  --c-sage: #383e22;
  --c-olive: #C5CC82;

  --bd: #3d2f36;
  --bar: #2e2328;
  --ok: #C5CC82;
  --ok-soft: rgba(197, 204, 130, 0.2);
  --bad: #ea6b77;
  --bad-soft: rgba(234, 107, 119, 0.2);
  --hd: #431a2b;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg-color-mixed, var(--bg));
  color: var(--tx);
  font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}

/* App Shell */
.app-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 14px;
}

/* Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--bd);
}
.brand-area {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.brand-title {
  font: 700 24px/1.2 Georgia, "Times New Roman", serif;
  margin: 0;
  color: var(--tx);
  letter-spacing: -0.5px;
}
.brand-badge {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--ac-soft);
  color: var(--ac-dark);
  padding: 3px 8px;
  border-radius: var(--radius-full);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Command Bar (Tính năng 4: Natural Language Quick Input) */
.quick-capture-box {
  background: var(--card);
  border: 1.5px solid var(--ac);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  margin-bottom: 16px;
  box-shadow: 0 2px 10px var(--ac-soft);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.quick-capture-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.quick-capture-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 14px;
  color: var(--tx);
  outline: none;
  padding: 4px 0;
}
.quick-capture-input::placeholder {
  color: var(--mu);
}
.quick-preview-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 12px;
  padding-top: 6px;
  border-top: 1px dashed var(--bd);
}

/* Primary Tabs Nav */
nav.main-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 12px 2px;
  position: sticky;
  top: 0;
  background: var(--bg-color-mixed, var(--bg));
  z-index: 20;
  backdrop-filter: blur(8px);
  -webkit-overflow-scrolling: touch;
}
nav.main-nav::-webkit-scrollbar { display: none; }
nav.main-nav button {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx-sec);
  padding: 8px 16px;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
nav.main-nav button:hover {
  background: var(--c-blush);
  color: var(--tx);
  border-color: var(--ac);
}
nav.main-nav button.active {
  background: var(--ac);
  color: var(--ac-dark);
  border-color: var(--ac);
  font-weight: 600;
  box-shadow: 0 2px 8px var(--ac-soft);
}

/* Card & Buttons */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.card-title {
  margin: 0;
  font: 600 17px/1.3 Georgia, serif;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-sub {
  color: var(--mu);
  font-size: 13px;
  margin-top: 3px;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  user-select: none;
}
.btn:hover {
  background: var(--c-blush);
  border-color: var(--ac);
}
.btn.btn-primary {
  background: var(--ac);
  color: var(--ac-dark);
  border-color: var(--ac);
  font-weight: 600;
}
.btn.btn-primary:hover {
  background: var(--ac-hover);
  box-shadow: 0 2px 8px var(--ac-soft);
}
.btn.btn-accent-olive {
  background: var(--c-olive);
  color: #fff;
  border-color: var(--c-olive);
}
.btn.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}
.btn.btn-ghost {
  border-color: transparent;
  background: transparent;
  box-shadow: none;
}
.btn.btn-ghost:hover {
  background: var(--c-blush);
}
.btn.btn-danger {
  color: var(--bad);
  border-color: var(--bad-soft);
}
.btn.btn-danger:hover {
  background: var(--bad-soft);
}

input, select, textarea {
  font: inherit;
  font-size: 13.5px;
  padding: 8px 12px;
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  background: var(--bg);
  color: var(--tx);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--bd-focus);
  box-shadow: 0 0 0 3px var(--ac-soft);
}
input[type="number"] { width: 80px; }
input[type="time"] { min-width: 105px; }

/* Status Badges */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
}
.pill.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill.pill-cyan { background: var(--c-cyan); color: #214346; }
.pill.pill-blush { background: var(--c-blush); color: var(--ac-dark); }
.pill.pill-neutral { background: var(--bar); color: var(--tx-sec); }

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* View Switcher */
.segmented-control {
  display: inline-flex;
  background: var(--bar);
  padding: 3px;
  border-radius: var(--radius-md);
  gap: 2px;
}
.segmented-control button {
  border: none;
  background: transparent;
  color: var(--tx-sec);
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 500;
  border-radius: calc(var(--radius-md) - 2px);
  cursor: pointer;
  transition: all 0.15s ease;
}
.segmented-control button.active {
  background: var(--card);
  color: var(--tx);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* Pin năng lượng (Daily Battery Widget) */
.battery-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  font-size: 11.5px;
  font-weight: 600;
}
.battery-badge.positive {
  background: var(--ok-soft);
  color: var(--ok);
}
.battery-badge.negative {
  background: var(--bad-soft);
  color: var(--bad);
}
.battery-badge.balanced {
  background: var(--c-cyan);
  color: #1a4245;
}
.battery-badge.idle {
  background: var(--bar);
  color: var(--mu);
}
.battery-icon {
  width: 18px;
  height: 10px;
  border: 1.5px solid currentColor;
  border-radius: 2.5px;
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 1px;
}
.battery-icon::after {
  content: "";
  position: absolute;
  right: -3.5px;
  top: 2px;
  bottom: 2px;
  width: 2px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}
.battery-fill {
  height: 100%;
  background: currentColor;
  border-radius: 1px;
  transition: width 0.3s;
}

/* Calendar Week Cards (Tuần chi tiết) */
.week-cards-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
@media (max-width: 992px) {
  .week-cards-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 640px) {
  .week-cards-grid { grid-template-columns: 1fr; }
}

.day-card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  min-height: 200px;
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.day-card:hover {
  border-color: var(--ac);
  box-shadow: var(--shadow-sm);
}
.day-card.today {
  border: 2px solid var(--ac);
  background: color-mix(in srgb, var(--ac) 5%, var(--card));
}
.day-card-header {
  padding: 8px 10px;
  background: var(--card-subtle);
  border-bottom: 1px solid var(--bd);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.day-card.today .day-card-header {
  background: var(--ac);
  color: var(--ac-dark);
}
.day-card.today .day-card-header .day-name,
.day-card.today .day-card-header .day-date {
  color: var(--ac-dark);
}
.day-name {
  font-weight: 600;
  font-size: 13px;
  color: var(--tx);
}
.day-date {
  font-size: 12px;
  color: var(--mu);
}
.day-battery-row {
  padding: 5px 10px;
  background: color-mix(in srgb, var(--bar) 50%, var(--card));
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--bd);
}
.day-events-list {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.day-card-add-btn {
  margin: 6px 8px 8px 8px;
  padding: 6px;
  border: 1px dashed var(--bd);
  background: transparent;
  color: var(--mu);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.15s ease;
}
.day-card-add-btn:hover {
  border-color: var(--ac);
  color: var(--ac-dark);
  background: var(--ac-soft);
}

/* Event Item */
.event-item {
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 12px;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  border-left: 3.5px solid transparent;
  background: var(--card-subtle);
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
}
.event-item:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.event-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
}
.event-title {
  font-weight: 600;
  color: var(--tx);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.event-meta {
  font-size: 11px;
  color: var(--mu);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.event-mode-up { color: var(--ok); font-weight: 700; }
.event-mode-down { color: var(--bad); font-weight: 700; }

/* Dòng thời gian 24h */
.timeline-container {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.timeline-days-nav {
  display: flex;
  gap: 6px;
  padding: 10px;
  background: var(--card-subtle);
  border-bottom: 1px solid var(--bd);
  overflow-x: auto;
}
.timeline-grid {
  position: relative;
  height: 864px; /* 18h từ 06:00 đến 24:00, mỗi giờ 48px */
  overflow-y: auto;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 47px,
    var(--bd) 48px
  );
}
.timeline-hour-mark {
  position: absolute;
  left: 10px;
  font-size: 11px;
  color: var(--mu);
  transform: translateY(-50%);
  user-select: none;
}
.timeline-content-area {
  position: absolute;
  left: 60px;
  right: 14px;
  top: 0;
  bottom: 0;
}
.timeline-event-block {
  position: absolute;
  left: 0;
  right: 0;
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-size: 12px;
  color: #fff;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  cursor: pointer;
  transition: transform 0.1s ease;
}
.timeline-event-block:hover {
  transform: scale(1.01);
  z-index: 5;
}

/* ==========================================================================
   CSS CHO LƯỚI 53 TUẦN (SỬA LỖI HIỂN THỊ)
   ========================================================================== */
.table-wrapper {
  overflow: auto;
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  background: var(--card);
  max-height: 72vh;
  box-shadow: var(--shadow-sm);
  position: relative;
  -webkit-overflow-scrolling: touch;
}
table.calendar-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 940px;
}
table.calendar-table th {
  background: var(--hd);
  color: #ffffff;
  padding: 10px 8px;
  position: sticky;
  top: 0;
  font-weight: 600;
  font-size: 13px;
  z-index: 10;
  text-align: center;
  border-bottom: 2px solid var(--bd);
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
table.calendar-table td {
  padding: 6px;
  border-top: 1px solid var(--bd);
  vertical-align: top;
  text-align: center;
  font-size: 12.5px;
}
td.cal-day-cell {
  cursor: pointer;
  min-width: 110px;
  height: 74px;
  transition: background 0.15s ease;
  position: relative;
}
td.cal-day-cell:hover {
  background: var(--c-blush);
}
td.cal-day-cell.is-today {
  background: color-mix(in srgb, var(--ac) 15%, var(--card));
  outline: 2px solid var(--ac);
  outline-offset: -2px;
}
td.cal-day-cell small {
  color: var(--mu);
  display: block;
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 4px;
}
tr.current-week td {
  background: color-mix(in srgb, var(--ac) 8%, var(--card));
}
tr.current-week td:first-child, tr.current-week td:nth-child(2) {
  font-weight: 700;
  color: var(--ac-dark);
}
tr.past-week td {
  opacity: 0.85;
}

/* Bánh xe cuộc đời Radar Chart */
.radar-box {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}
.radar-svg {
  width: 100%;
  max-width: 380px;
  height: auto;
  overflow: visible;
}

/* 168h Bar */
.progress-168-bar {
  display: flex;
  height: 24px;
  border-radius: var(--radius-full);
  overflow: hidden;
  background: var(--bar);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
  margin: 14px 0 10px;
}
.progress-168-seg {
  height: 100%;
  transition: width 0.3s ease;
}
.progress-168-seg:hover { filter: brightness(1.1); }

/* Bảng tóm tắt */
table.sum-table {
  width: 100%;
  border-collapse: collapse;
}
table.sum-table th {
  padding: 10px 8px;
  font-weight: 600;
  font-size: 13px;
  color: var(--tx-sec);
  border-bottom: 2px solid var(--bd);
  text-align: center;
}

<script>
/* ==========================================================================
   1. DỮ LIỆU CỐT LÕI (5 LOẠI VỐN VỚI BẢNG MÀU YÊU CẦU)
   ========================================================================== */
const DCAP = [
  ["sk", "Sức khỏe", "#97A13B", 6],
  ["qh", "Quan hệ", "#E0A3BB", 5],
  ["tn", "Trải nghiệm", "#8b6da9", 3],
  ["kn", "Kỹ năng", "#4a859c", 4],
  ["tc", "Tài chính / công việc", "#b88628", 0]
];
const DN_VI = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ Nhật"];
const DN_SHORT = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
const PALETTE = ["#E0A3BB", "#97A13B", "#4a859c", "#8b6da9", "#b88628", "#c24d5b", "#642841"];

const ad = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ky = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const W0 = new Date(2025, 11, 29); // Monday Dec 29, 2025 = Tuần 1 năm 2026
const W = [...Array(53)].map((_, i) => ad(W0, i * 7));

const sd = (m, d, t, c, h) => [ky(new Date(2026, m - 1, d)), { t, c, m: "u", h }];
const SEED = [
  [9, 9, "Đánh cầu", "sk", 2],
  [9, 10, "Spa", "sk", 2],
  [9, 11, "Đánh cầu", "sk", 2],
  [9, 13, "Đi xem cầu lông", "tn", 2],
  [9, 16, "Đánh cầu", "sk", 2],
  [9, 18, "Dinner w chị em GM", "qh", 2.5],
  [9, 25, "Đánh cầu", "sk", 2],
  [9, 28, "Đánh cầu", "sk", 2],
  [10, 2, "Dinner w bạn anh Tín", "qh", 2.5],
  [10, 5, "Đánh cầu", "sk", 2],
  [10, 7, "Đánh cầu", "sk", 2],
  [10, 8, "Dinner w LHương", "qh", 2.5],
  [10, 9, "Sinh nhật", "qh", 3],
  [10, 12, "Đánh cầu", "sk", 2],
  [10, 14, "Đánh cầu", "sk", 2],
  [10, 18, "Đám cưới bạn anh", "qh", 4]
];

function defState() {
  const ev = {};
  SEED.forEach(a => {
    const [k, e] = sd(...a);
    (ev[k] = ev[k] || []).push(e);
  });
  return {
    ev,
    caps: DCAP.map(c => ({ k: c[0], n: c[1], c: c[2], tg: c[3] })),
    bl: {},
    mem: {},
    pm: "0"
  };
}

let S;
try {
  S = JSON.parse(localStorage.getItem("lc2") || "null") || defState();
} catch (e) {
  S = defState();
}

if (!S.caps) S.caps = DCAP.map(c => ({ k: c[0], n: c[1], c: c[2], tg: (S.tg || {})[c[0]] ?? c[3] }));
S.bl = S.bl || {};
S.mem = S.mem || {};

const cmp = (a, b) => (a.s || "99:99").localeCompare(b.s || "99:99");
const sortL = l => l.sort(cmp);
Object.values(S.ev).forEach(sortL);

const CM = k => S.caps.find(c => c.k === k) || { n: "(đã xóa)", c: "#888888", tg: 0 };
const BL = k => S.bl[k] = S.bl[k] || { u: 0, d: 0 };
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = i => document.getElementById(i);
const r1 = n => (Math.round((n || 0) * 10) / 10).toString();
const pad = n => String(n).padStart(2, "0");
const tt = (s, h) => {
  if (!s) return "";
  const [a, b] = s.split(":").map(Number);
  const m = Math.min(1439, a * 60 + b + Math.round((h || 0) * 60));
  return pad(m / 60 | 0) + ":" + pad(m % 60);
};

const save = () => {
  try {
    localStorage.setItem("lc2", JSON.stringify(S));
  } catch (e) {
    showToast("Không thể lưu vào localStorage!", "bad");
  }
};

/* ==========================================================================
   2. TÍNH TOÁN TUẦN & LOGIC PIN NĂNG LƯỢNG
   ========================================================================== */
let T0, tk;
const wkNow = () => {
  const n = new Date();
  T0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  tk = ky(T0);
  return Math.min(52, Math.max(0, Math.floor(Math.round((T0 - W0) / 864e5) / 7)));
};
let CW = wkNow(), lt = tk, sel = CW;
let cur = "ca"; // Tabs: "ca" (Lịch tuần), "su" (Hiệu suất 168h), "set" (Cài đặt vốn), "bak" (Sao lưu)
let calSubView = "focus"; // "focus" (Tuần chi tiết), "timeline" (Dòng thời gian 24h), "year" (Lưới 53 tuần)
let timelineDayIdx = 0; // 0 = T2 .. 6 = CN
let N = 4;
let ed = null, ei = null;

const evs = i => [0, 1, 2, 3, 4, 5, 6].flatMap(j => S.ev[ky(ad(W[i], j))] || []);
function wk(i, c) {
  const b = BL(c);
  let u = b.u, d = b.d;
  evs(i).forEach(e => {
    if (e.c === c) {
      if (e.m === "u") u += e.h;
      else d += e.h;
    }
  });
  return { u, d };
}
const al = i => S.caps.reduce((a, c) => {
  const w = wk(i, c.k);
  return a + w.u + w.d;
}, 0);

// Tính toán Pin năng lượng trong ngày
function getDayBattery(dateStr) {
  const events = S.ev[dateStr] || [];
  let u = 0, d = 0;
  events.forEach(e => {
    if (e.m === "u") u += e.h;
    else d += e.h;
  });
  const net = u - d;
  const isBurnout = d >= 6 || (d - u >= 4);
  let fillPercent = 50;
  let statusClass = "idle";
  let label = "0h";

  if (events.length === 0) {
    fillPercent = 0;
    statusClass = "idle";
    label = "Chưa ghi";
  } else if (net > 0) {
    fillPercent = Math.min(100, 50 + net * 12);
    statusClass = "positive";
    label = `+${r1(net)}h Nạp`;
  } else if (net < 0) {
    fillPercent = Math.max(10, 50 + net * 10);
    statusClass = "negative";
    label = `${r1(net)}h Rút`;
  } else {
    fillPercent = 50;
    statusClass = "balanced";
    label = "Cân bằng";
  }

  return { u, d, net, fillPercent, statusClass, label, isBurnout };
}

function guess(t) {
  t = (t || "").normalize("NFC");
  const m = S.mem && S.mem[t.trim().toLowerCase()];
  if (m && S.caps.some(c => c.k === m.c)) return m.c;
  const w = " " + t.toLowerCase().split(/[^\p{L}\p{N}]+/u).join(" ") + " ";
  const has = a => a.some(k => w.includes(" " + k + " "));
  if (has(["học", "đọc", "course", "study", "khóa", "sách", "tiếng anh", "code", "nghiên cứu"])) return "kn";
  if (has(["họp", "làm", "work", "meeting", "deep", "dự án", "khách", "bán", "deal", "code"])) return "tc";
  if (has(["xem", "du lịch", "trip", "phim", "workshop", "thử", "concert", "cafe", "chill", "ăn uống"])) return "tn";
  if (has(["dinner", "sinh nhật", "cưới", "gia đình", "bạn", "date", "chị", "em", "anh", "bố", "mẹ", "thăm"])) return "qh";
  return "sk";
}

/* ==========================================================================
   3. TOAST NOTIFICATIONS
   ========================================================================== */
function showToast(msg, type = "ok") {
  const c = $("toastContainer");
  if (!c) return;
  const t = document.createElement("div");
  t.className = `toast toast-${type}`;
  t.innerHTML = `${type === "ok" ? "✓" : "⚠"} <span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateY(10px)";
    t.style.transition = "all 0.2s ease";
    setTimeout(() => t.remove(), 200);
  }, 2600);
}

/* ==========================================================================
   4. TÍNH NĂNG 4: NATURAL LANGUAGE QUICK PARSER (GHI NHANH)
   ========================================================================== */
let parsedNLP = null;

function parseNLPText(str) {
  if (!str || !str.trim()) return null;
  const raw = str.trim();
  const lower = raw.toLowerCase();

  // 1. Phân tích ngày
  let targetDate = tk;
  let dateDesc = "Hôm nay";
  const now = new Date();

  if (lower.includes("ngày mai") || lower.includes("sáng mai") || lower.includes("tối mai") || lower.includes("mai")) {
    targetDate = ky(ad(now, 1));
    dateDesc = "Ngày mai (" + targetDate.slice(5) + ")";
  } else if (lower.includes("ngày mốt") || lower.includes("mốt") || lower.includes("ngày kia")) {
    targetDate = ky(ad(now, 2));
    dateDesc = "Ngày kia (" + targetDate.slice(5) + ")";
  } else {
    const matchThu = lower.match(/(?:thứ|t)\s*([2-7]|hai|ba|tư|bốn|năm|sáu|bảy|cn|chủ nhật)/);
    if (matchThu) {
      const mapDays = { "2": 0, "hai": 0, "3": 1, "ba": 1, "4": 2, "tư": 2, "bốn": 2, "5": 3, "năm": 3, "6": 4, "sáu": 4, "7": 5, "bảy": 5, "cn": 6, "chủ nhật": 6 };
      const dIdx = mapDays[matchThu[1]];
      if (dIdx !== undefined) {
        targetDate = ky(ad(W[CW], dIdx));
        dateDesc = DN_VI[dIdx] + " (" + targetDate.slice(5) + ")";
      }
    }
  }

  // 2. Phân tích giờ bắt đầu
  let startTime = "07:00";
  const matchTime1 = lower.match(/(\d{1,2})h(\d{2})?/);
  const matchTime2 = lower.match(/(\d{1,2}):(\d{2})/);
  const matchTime3 = lower.match(/(\d{1,2})\s*(sáng|trưa|chiều|tối)/);

  if (matchTime2) {
    startTime = pad(matchTime2[1]) + ":" + pad(matchTime2[2]);
  } else if (matchTime1) {
    startTime = pad(matchTime1[1]) + ":" + pad(matchTime1[2] || 0);
  } else if (matchTime3) {
    let hr = parseInt(matchTime3[1], 10);
    const period = matchTime3[2];
    if ((period === "chiều" || period === "tối") && hr < 12) hr += 12;
    startTime = pad(hr) + ":00";
  }

  // 3. Phân tích thời lượng
  let duration = 2;
  const matchDurHour = lower.match(/(\d+(?:\.\d+)?)\s*(?:tiếng|giờ|h)\b/);
  const matchDurMin = lower.match(/(\d+)\s*(?:phút|p)\b/);

  if (matchDurHour) {
    duration = parseFloat(matchDurHour[1]);
  } else if (matchDurMin) {
    duration = Math.round(parseInt(matchDurMin[1], 10) / 60 * 10) / 10;
  }

  // 4. Lọc bỏ các từ khóa ngày/giờ để lấy tên hoạt động sạch
  let cleanTitle = raw
    .replace(/(?:hôm nay|ngày mai|sáng mai|tối mai|mai|mốt|ngày mốt|ngày kia)/gi, "")
    .replace(/(?:thứ|t)\s*(?:[2-7]|hai|ba|tư|bốn|năm|sáu|bảy|cn|chủ nhật)/gi, "")
    .replace(/(?:\d{1,2}h\d{0,2}|\d{1,2}:\d{2}|\d{1,2}\s*(?:sáng|trưa|chiều|tối))/gi, "")
    .replace(/(?:\d+(?:\.\d+)?\s*(?:tiếng|giờ|h)|\d+\s*(?:phút|p))/gi, "")
    .replace(/[,\-–]/g, " ")
    .trim();

  if (!cleanTitle) cleanTitle = "Hoạt động mới";

  // 5. Dự đoán tác động nạp ▲ / tiêu ▼ và loại vốn
  const hasDrain = ["họp", "meeting", "ot", "deadline", "công việc", "xử lý", "làm việc", "áp lực", "stress", "tăng ca"].some(k => lower.includes(k));
  const mode = hasDrain ? "d" : "u";
  const capKey = guess(cleanTitle);

  return {
    raw,
    title: cleanTitle,
    targetDate,
    dateDesc,
    startTime,
    duration,
    capKey,
    mode
  };
}

function handleNLPInput(val) {
  parsedNLP = parseNLPText(val);
  const p = $("nlpPreview");
  if (!parsedNLP) {
    p.style.display = "none";
    return;
  }
  const cap = CM(parsedNLP.capKey);
  p.style.display = "flex";
  p.innerHTML = `
    <span class="pill pill-cyan">📅 ${parsedNLP.dateDesc}</span>
    <span class="pill pill-neutral">⏰ ${parsedNLP.startTime} (${parsedNLP.duration}h)</span>
    <span class="pill ${parsedNLP.mode === 'u' ? 'pill-ok' : 'pill-bad'}">${parsedNLP.mode === 'u' ? '▲ Nạp' : '▼ Tiêu'}</span>
    <span class="pill" style="background:${cap.c}; color:#fff;">🏷️ ${esc(cap.n)}</span>
    <span style="font-weight:600; color:var(--tx); margin-left:4px;">"${esc(parsedNLP.title)}"</span>
  `;
}

function executeNLP() {
  const input = $("nlpInput");
  const res = parseNLPText(input.value);
  if (!res) {
    showToast("Vui lòng nhập nội dung!", "bad");
    return;
  }

  const o = {
    t: res.title,
    c: res.capKey,
    m: res.mode,
    h: res.duration,
    s: res.startTime
  };

  const L = S.ev[res.targetDate] = S.ev[res.targetDate] || [];
  L.push(o);
  sortL(L);

  S.mem = S.mem || {};
  S.mem[res.title.normalize("NFC").toLowerCase()] = { c: res.capKey };

  save();
  input.value = "";
  handleNLPInput("");
  draw();
  showToast(`Đã thêm: "${res.title}" vào ${res.dateDesc}`, "ok");
}

/* ==========================================================================
   5. TÍNH NĂNG 1: BÁNH XE CUỘC ĐỜI (WHEEL OF LIFE RADAR CHART SVG)
   ========================================================================== */
function renderRadarChartSVG(weekIdx) {
  const caps = S.caps;
  const numCaps = caps.length;
  if (numCaps < 3) return `<p style="color:var(--mu); text-align:center;">Cần ít nhất 3 loại vốn để vẽ biểu đồ.</p>`;

  const cx = 170, cy = 145, r = 90;
  const angles = caps.map((_, i) => -Math.PI / 2 + (i * 2 * Math.PI / numCaps));

  const levels = [0.25, 0.5, 0.75, 1.0];
  let levelPolygons = levels.map(lvl => {
    const pts = angles.map(a => `${cx + r * lvl * Math.cos(a)},${cy + r * lvl * Math.sin(a)}`).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="var(--bd)" stroke-width="${lvl === 1.0 ? '1.5' : '1'}" stroke-dasharray="${lvl === 1.0 ? '' : '3,3'}" />`;
  }).join("");

  let axisLines = angles.map(a => {
    return `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}" stroke="var(--bd)" stroke-width="1" />`;
  }).join("");

  const dataPoints = caps.map((c, i) => {
    const w = wk(weekIdx, c.k);
    const target = c.tg || 6;
    const ratio = Math.min(1.2, Math.max(0.1, w.u / target));
    const a = angles[i];
    return {
      x: cx + r * ratio * Math.cos(a),
      y: cy + r * ratio * Math.sin(a),
      val: w.u,
      target,
      cap: c
    };
  });

  const polyStr = dataPoints.map(p => `${p.x},${p.y}`).join(" ");

  let labels = caps.map((c, i) => {
    const a = angles[i];
    const lx = cx + (r + 28) * Math.cos(a);
    const ly = cy + (r + 18) * Math.sin(a);
    const anchor = Math.abs(Math.cos(a)) < 0.2 ? "middle" : Math.cos(a) > 0 ? "start" : "end";
    const w = wk(weekIdx, c.k);
    return `
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="11" font-weight="600" fill="var(--tx)">
        ${esc(c.n)}
      </text>
      <text x="${lx}" y="${ly + 12}" text-anchor="${anchor}" font-size="10" fill="var(--mu)">
        ${r1(w.u)}h / ${c.tg ? r1(c.tg) + 'h' : '–'}
      </text>
    `;
  }).join("");

  return `
    <div class="radar-box">
      <svg class="radar-svg" viewBox="0 0 340 300">
        ${levelPolygons}
        ${axisLines}
        <polygon points="${polyStr}" fill="rgba(224, 163, 187, 0.35)" stroke="var(--ac)" stroke-width="2.5" />
        ${dataPoints.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${p.cap.c}" stroke="#fff" stroke-width="1.5" />`).join("")}
        ${labels}
      </svg>
    </div>
  `;
}

/* ==========================================================================
   6. TÍNH NĂNG 8: SUNDAY WEEKLY REVIEW MODAL (TỔNG KẾT TUẦN)

function openWeeklyReviewModal(wIdx = sel) {
  const wStart = W[wIdx];
  const wEnd = ad(wStart, 6);
  const rangeStr = `Tuần W${wIdx + 1} (${wStart.toLocaleDateString("vi-VN", { day: "numeric", month: "numeric" })} – ${wEnd.toLocaleDateString("vi-VN", { day: "numeric", month: "numeric", year: "numeric" })})`;

  $("reviewSheetTitle").innerHTML = `<span>🏆 Báo Cáo Tổng Kết ${rangeStr}</span>`;

  let totalU = 0, totalD = 0;
  S.caps.forEach(c => {
    const w = wk(wIdx, c.k);
    totalU += w.u;
    totalD += w.d;
  });
  const totalAlloc = al(wIdx);
  const netEnergy = totalU - totalD;

  const capStats = S.caps.map(c => {
    const w = wk(wIdx, c.k);
    const target = c.tg || 0;
    const ratio = target > 0 ? (w.u / target) : 1;
    return { c, u: w.u, d: w.d, target, ratio, diff: w.u - target };
  });

  const starCap = [...capStats].sort((a, b) => b.ratio - a.ratio)[0];
  const laggingCap = [...capStats].filter(x => x.target > 0).sort((a, b) => a.diff - b.diff)[0];

  const html = `
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px;">
        <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
          <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Tổng Nạp / Rút</div>
          <div style="font:700 20px Georgia, serif; margin-top:4px;">
            <span style="color:var(--ok)">▲${r1(totalU)}h</span> · <span style="color:var(--bad)">▼${r1(totalD)}h</span>
          </div>
          <small style="color:var(--tx-sec)">Cán cân: <b>${netEnergy >= 0 ? '+' : ''}${r1(netEnergy)}h</b></small>
        </div>
        <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
          <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Quỹ 168 Giờ</div>
          <div style="font:700 20px Georgia, serif; margin-top:4px;">
            ${r1(totalAlloc)}h <span style="font-size:13px; font-weight:400; color:var(--mu);">(${Math.round(totalAlloc/168*100)}%)</span>
          </div>
          <small style="color:${totalAlloc > 168 ? 'var(--bad)' : 'var(--ok)'}">
            ${totalAlloc > 168 ? 'Vượt giới hạn 168h!' : `Còn ${r1(168 - totalAlloc)}h chưa phân bổ`}
          </small>
        </div>
        <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
          <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Đánh giá pin tuần</div>
          <div style="font:700 20px Georgia, serif; margin-top:4px; color:${netEnergy >= 0 ? 'var(--ok)' : 'var(--bad)'}">
            ${netEnergy >= 0 ? '🔋 Nạp pin tốt' : '🪫 Thâm hụt pin'}
          </div>
          <small style="color:var(--tx-sec)">${netEnergy >= 0 ? 'Tuần tái tạo năng lượng hiệu quả' : 'Cần bù đắp nghỉ ngơi tuần sau'}</small>
        </div>
      </div>

      <div style="border:1px solid var(--bd); border-radius:var(--radius-md); padding:12px; background:var(--card);">
        <div style="font-weight:600; font-size:14px; margin-bottom:4px; text-align:center;">
          Bánh Xe Cuộc Đời · Tuần W${wIdx + 1}
        </div>
        ${renderRadarChartSVG(wIdx)}
      </div>

      <div style="display:flex; flex-direction:column; gap:8px; font-size:13.5px;">
        ${starCap ? `
          <div style="padding:10px 14px; background:var(--ok-soft); border-radius:var(--radius-md); border-left:4px solid var(--ok);">
            ⭐ <b>Điểm sáng của tuần:</b> Vốn <b>${esc(starCap.c.n)}</b> đạt <b>${r1(starCap.u)}h</b> (đạt ${Math.round(starCap.ratio*100)}% mục tiêu).
          </div>
        ` : ''}
        ${laggingCap && laggingCap.diff < 0 ? `
          <div style="padding:10px 14px; background:var(--bad-soft); border-radius:var(--radius-md); border-left:4px solid var(--bad);">
            ⚠️ <b>Cần bổ sung gấp:</b> Vốn <b>${esc(laggingCap.c.n)}</b> chỉ đạt ${r1(laggingCap.u)}h / ${r1(laggingCap.target)}h (thiếu hụt <b>${r1(Math.abs(laggingCap.diff))}h</b>).
          </div>
        ` : ''}
      </div>

      <div style="padding:12px; background:var(--c-blush); border-radius:var(--radius-md); font-size:13px; color:var(--ac-dark);">
        💡 <b>Đề xuất kế hoạch tuần tới:</b> Hãy ưu tiên lên lịch ngay cho <b>${laggingCap ? esc(laggingCap.c.n) : 'các sở thích cá nhân'}</b> vào Thứ 2 hoặc Thứ 4 tới để cân bằng bánh xe cuộc sống.
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" onclick="copyReviewToClipboard(${wIdx})">📋 Sao chép tóm tắt</button>
        <button class="btn btn-primary" onclick="closeReviewModal()">Xác nhận & Đóng</button>
      </div>
    </div>
  `;

  $("reviewSheetBody").innerHTML = html;
  $("reviewModalOverlay").classList.add("open");
}

function closeReviewModal() {
  $("reviewModalOverlay").classList.remove("open");
}
function handleReviewBackdropClick(e) {
  if (e.target.id === "reviewModalOverlay") closeReviewModal();
}

function copyReviewToClipboard(wIdx) {
  let totalU = 0, totalD = 0;
  S.caps.forEach(c => {
    const w = wk(wIdx, c.k);
    totalU += w.u;
    totalD += w.d;
  });
  const text = `🏆 [Life Capital] Tổng kết Tuần W${wIdx + 1}: Nạp ▲${r1(totalU)}h | Tiêu ▼${r1(totalD)}h | Cán cân: ${totalU - totalD >= 0 ? '+' : ''}${r1(totalU - totalD)}h. Quỹ 168h: ${r1(al(wIdx))}h.`;
  navigator.clipboard.writeText(text).then(() => {
    showToast("Đã sao chép tóm tắt vào bộ nhớ tạm!", "ok");
  });
}

const TABS = [
  { id: "ca", label: "Lịch biểu", icon: "📅" },
  { id: "su", label: "Tổng quan & 168h", icon: "📊" },
  { id: "set", label: "Cài đặt loại vốn", icon: "⚙️" },
  { id: "bak", label: "Sao lưu & Dữ liệu", icon: "💾" }
];

function renderNav() {
  $("nav").innerHTML = TABS.map(t =>
    `<button class="${t.id === cur ? "active" : ""}" onclick="switchTab('${t.id}')">
      <span>${t.icon}</span> <span>${t.label}</span>
    </button>`
  ).join("");
}

function switchTab(tabId) {
  cur = tabId;
  draw();
}

function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("lc_theme", next);
  updateThemeButton();
}

function updateThemeButton() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const lbl = $("themeLabel");
  if (lbl) lbl.textContent = isDark ? "Tối" : "Sáng";
}

const V = {

          </div>

            </div>

              <span class="battery-badge ${bat.statusClass}">
                <span class="battery-icon"><span class="battery-fill" style="width:${bat.fillPercent}%"></span></span>
                ${bat.label}
              </span>
              ${bat.isBurnout ? `<span class="pill pill-bad" style="font-size:10px; padding:1px 5px;" title="Cảnh báo kiệt sức năng lượng!">Kiệt sức</span>` : ''}

                      <span>${e.s ? e.s + ' · ' : ''}${r1(e.h)}h</span>
                      <span style="color:${cap.c}; font-weight:500;">${esc(cap.n)}</span>
                    </div>

              }).join("")}
            </div>
            <button class="day-card-add-btn" onclick="openEditor('${k}')">
              + Thêm
            </button>
          </div>
        `;
      }
      cards += '</div>';
      return headerBar + cards;
    }

    // 2. Chế độ DÒNG THỜI GIAN 24H
    if (calSubView === "timeline") {
      const activeDate = ky(ad(selWeekStart, timelineDayIdx));
      const activeEvents = S.ev[activeDate] || [];
      const bat = getDayBattery(activeDate);
      const isViewingToday = activeDate === tk;

      const dayNav = `
        <div class="timeline-days-nav">
          ${[0, 1, 2, 3, 4, 5, 6].map(idx => {
            const d = ad(selWeekStart, idx);
            const dkStr = ky(d);

              </button>
            `;
          }).join("")}

      `;

      let hourMarkers = "";
      for (let h = 6; h <= 23; h++) {
        const topPx = (h - 6) * 48;
        hourMarkers += `<div class="timeline-hour-mark" style="top:${topPx}px;">${pad(h)}:00</div>`;
      }

      let eventBlocks = activeEvents.map((e, idx) => {
        if (!e.s) return "";

        return `

            <div>

    // 3. Chế độ LƯỚI 53 TUẦN (SỬA LỖI HOÀN CHỈNH)

        const es = S.ev[k] || [];

        tbl += `<td class="cal-day-cell ${isToday ? 'is-today' : ''}" tabindex="0" onclick="openEditor('${k}')">

          Σ ${r1(tot)}/168h

      </td></tr>`;
    }

    tbl += `</tbody></table></div>`;
    return headerBar + filterBar + tbl;
  },

  // --- TAB 2: HIỆU SUẤT & 168 GIỜ & BÁNH XE CUỘC ĐỜI ---
  su() {
    const nn0 = Math.max(0, W.findIndex((_, i) => evs(i).length));
    const from = N === 0 ? Math.min(nn0, sel) : Math.max(0, sel - N + 1);
    const nn = sel - from + 1;
    const pf = from - nn;

    const avg = (k, a, b) => {
      let u = 0, d = 0;
      for (let i = a; i <= b; i++) {
        const w = wk(i, k);
        u += w.u;
        d += w.d;
      }
      const n = b - a + 1;
      return [u / n, d / n];
    };

    const D = S.caps.map(c => {
      const k = c.k;
      const s = wk(sel, k);
      const [au, ad_] = avg(k, from, sel);
      const pa = N && pf >= 0 ? avg(k, pf, from - 1)[0] : null;
      return {
        c,
        s,
        au,
        ad: ad_,
        pa,
        p: c.tg ? au / c.tg : null,
        sp: [...Array(8)].map((_, j) => sel - 7 + j).filter(i => i >= 0).map(i => [i, wk(i, k).u])
      };
    });

    const A = al(sel);
    const den = Math.max(168, A);
    const free = Math.max(0, 168 - A);
    const sg = S.caps.map(c => {
      const w = wk(sel, c.k);
      return { c, h: w.u + w.d };
    }).filter(x => x.h > 0);

    const selectorBar = `
      <div class="card" style="margin-bottom:12px; padding:12px 16px;">
        <div class="card-header" style="margin-bottom:0">
          <div class="row">
            <button class="btn btn-sm" onclick="sel=Math.max(0, sel-1); draw()">◀</button>
            <select onchange="sel=+this.value; draw()" style="font-weight:600">
              ${W.map((m, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>Tuần W${i + 1} (${m.toLocaleDateString("vi-VN", { month: "numeric", day: "numeric" })})${i === CW ? ' - Hiện tại' : ''}</option>`).join("")}
            </select>
            <button class="btn btn-sm" onclick="sel=Math.min(52, sel+1); draw()">▶</button>
            ${sel !== CW ? `<button class="btn btn-sm btn-ghost" onclick="sel=CW; draw()">Về tuần này</button>` : ""}
          </div>
          <div class="row">
            <button class="btn btn-sm btn-accent-olive" onclick="openWeeklyReviewModal(${sel})">🏆 Báo cáo tổng kết W${sel+1}</button>
            <select onchange="N=+this.value; draw()">
              <option value="4" ${N === 4 ? 'selected' : ''}>TB 4 tuần</option>
              <option value="8" ${N === 8 ? 'selected' : ''}>TB 8 tuần</option>
              <option value="0" ${N === 0 ? 'selected' : ''}>Tất cả tuần</option>
            </select>
          </div>
        </div>
      </div>
    `;

    const pc = h => Math.round(h / 168 * 100);
    const f168 = `
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Khung 168 Giờ · Tuần W${sel + 1}</h2>
            <div class="card-sub">Tổng quỹ chuẩn: 168h (24 giờ × 7 ngày)</div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:12px;">
          <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
            <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">Đã phân bổ</div>
            <div style="font:700 22px Georgia, serif; margin-top:2px;">${r1(A)}h <span style="font-size:13px; font-weight:400; color:var(--mu);">(${pc(A)}%)</span></div>
          </div>
          <div style="background:var(--card-subtle); padding:12px; border-radius:var(--radius-md); border:1px solid var(--bd);">
            <div style="font-size:11px; color:var(--mu); text-transform:uppercase; font-weight:600;">${A > 168 ? 'Quá tải (Vượt)' : 'Chưa phân bổ'}</div>
            <div style="font:700 22px Georgia, serif; margin-top:2px; color:${A > 168 ? 'var(--bad)' : 'var(--ok)'}">
              ${A > 168 ? '+' + r1(A - 168) + 'h' : r1(free) + 'h'}
              <span style="font-size:13px; font-weight:400; color:var(--mu);">${A > 168 ? '(vượt mức)' : `(${pc(free)}%)`}</span>
            </div>
          </div>
        </div>

        <div class="progress-168-bar">
          ${sg.map(x => `<div class="progress-168-seg" style="width:${x.h / den * 100}%; background:${x.c.c};" title="${esc(x.c.n)}: ${r1(x.h)}h (${pc(x.h)}%)"></div>`).join("")}
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:10px 14px; font-size:12.5px;">
          ${sg.map(x => `<span class="row" style="gap:4px;"><span class="dot" style="background:${x.c.c}"></span><b>${esc(x.c.n)}</b>: ${r1(x.h)}h</span>`).join("")}
          <span class="row" style="gap:4px; color:var(--mu);"><span class="dot" style="background:var(--bar); border:1px solid var(--bd)"></span>Chưa phân bổ: ${r1(free)}h</span>
        </div>
      </div>
    `;

    const wheelCard = `
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Bánh Xe Cuộc Đời (Wheel of Life)</h2>
            <div class="card-sub">Trực quan hóa mức độ tròn trịa và cân bằng giữa 5 loại vốn trong tuần W${sel + 1}.</div>
          </div>
        </div>
        ${renderRadarChartSVG(sel)}
      </div>
    `;

    let tableRows = "", totU = 0, totD = 0;
    D.forEach(x => {
      totU += x.s.u;
      totD += x.s.d;
      const c = x.c;
      const mx = Math.max(1, c.tg, ...x.sp.map(a => a[1]));

      tableRows += `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="dot" style="background:${c.c}"></span>
              <b>${esc(c.n)}</b>
            </div>
          </td>
          <td>
            <span class="pill pill-ok" style="font-size:11px">▲ ${r1(x.s.u)}h</span>
            <span class="pill pill-bad" style="font-size:11px">▼ ${r1(x.s.d)}h</span>
          </td>
          <td>
            <div>▲ ${r1(x.au)}h · ▼ ${r1(x.ad)}h</div>
            <small style="color:var(--mu)">Ròng: ${x.au - x.ad >= 0 ? '+' : ''}${r1(x.au - x.ad)}h</small>
          </td>
          <td><b>${c.tg ? r1(c.tg) + "h" : "–"}</b></td>
          <td>
            <div class="sparkline-wrapper">
              ${x.sp.map(a => `
                <div class="sparkline-bar"
                     title="W${a[0] + 1}: ${r1(a[1])}h"
                     style="height:${Math.max(3, a[1] / mx * 26)}px; background:${c.c}; opacity:${a[0] === sel ? 1 : 0.4}">
                </div>
              `).join("")}
            </div>
          </td>
        </tr>
      `;
    });

    const reportTable = `
      <div class="card">
        <h2 class="card-title">Báo Cáo Giờ Theo Loại Vốn</h2>
        <div style="overflow-x:auto; margin-top:12px;">
          <table class="sum-table">
            <thead>
              <tr>
                <th>Loại vốn</th>
                <th>Tuần W${sel + 1}</th>
                <th>Trung bình ${nn} tuần</th>
                <th>Mục tiêu ▲</th>
                <th>Xu hướng 8 tuần</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
              <tr style="font-weight:600; background:var(--card-subtle);">
                <td>Tổng cộng</td>
                <td>
                  <span class="pill pill-ok">▲ ${r1(totU)}h</span>
                  <span class="pill pill-bad">▼ ${r1(totD)}h</span>
                </td>
                <td colspan="3"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    `;

    return selectorBar + wheelCard + f168 + reportTable;
  },

  // --- TAB 3: CÀI ĐẶT LOẠI VỐN (SETTINGS) ---
  set() {
    const list = S.caps.map((c) => {
      const b = BL(c.k);
      return `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <input type="color" value="${c.c}" onchange="updateCap('${c.k}', 'c', this.value)" style="width:28px; height:28px; padding:0; border:none; cursor:pointer; border-radius:4px; background:none;">
              <input type="text" value="${esc(c.n)}" onchange="updateCap('${c.k}', 'n', this.value)" style="width:160px; font-weight:500;">
            </div>
          </td>
          <td>
            <input type="number" step="0.5" min="0" value="${c.tg}" onchange="updateCap('${c.k}', 'tg', Math.max(0, +this.value || 0))">
          </td>
          <td>
            <input type="number" step="0.5" min="0" value="${b.u}" onchange="BL('${c.k}').u=Math.max(0, +this.value || 0); save(); draw();">
          </td>
          <td>
            <input type="number" step="0.5" min="0" value="${b.d}" onchange="BL('${c.k}').d=Math.max(0, +this.value || 0); save(); draw();">
          </td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="deleteCap('${c.k}')">Xóa</button>
          </td>
        </tr>
      `;
    }).join("");

    return `
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Cài Đặt Loại Vốn & Giờ Cố Định</h2>
            <div class="card-sub">Tùy biến tên, màu sắc, mục tiêu nạp và giờ cố định lặp mỗi tuần (Baseline).</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="addCap()">+ Thêm loại vốn</button>
        </div>

        <div style="overflow-x:auto;">
          <table class="sum-table">
            <thead>
              <tr>
                <th style="text-align:left">Tên vốn & Màu sắc</th>
                <th>Mục tiêu nạp ▲<br><small style="color:var(--mu); font-weight:400;">giờ/tuần</small></th>
                <th>Cố định nạp ▲<br><small style="color:var(--mu); font-weight:400;">(vd: thể thao 6h)</small></th>
                <th>Cố định tiêu ▼<br><small style="color:var(--mu); font-weight:400;">(vd: làm việc 40h)</small></th>
                <th style="width:60px"></th>
              </tr>
            </thead>
            <tbody>
              ${list}
            </tbody>
          </table>
        </div>
      </div>
    `;
  },

  // --- TAB 4: SAO LƯU & DỮ LIỆU (BACKUP) ---
  bak() {
    const totalEvents = Object.values(S.ev).flat().length;
    return `
      <div class="card">
        <h2 class="card-title">Sao Lưu & Khôi Phục Dữ Liệu</h2>
        <div class="card-sub">Dữ liệu hiện tại bao gồm <b>${totalEvents} hoạt động</b> được lưu an toàn trong trình duyệt của bạn.</div>

        <div style="margin:16px 0; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="exportData('json')">📥 Xuất sao lưu (.json)</button>
          <button class="btn" onclick="exportData('csv')">📊 Xuất lịch trình (.csv)</button>
        </div>

        <hr style="border:none; border-top:1px solid var(--bd); margin:20px 0;">

        <h3 style="font:600 15px Georgia, serif; margin:0 0 8px;">Khôi phục từ tệp tin</h3>
        <div class="row" style="margin-bottom:14px;">
          <input type="file" accept=".json,application/json" onchange="importData(this)">
          <select id="importModeSelect">
            <option value="merge">Gộp thêm vào dữ liệu hiện tại</option>
            <option value="replace">Ghi đè thay thế toàn bộ</option>
          </select>
        </div>
      </div>
    `;
  }
};

/* ==========================================================================
   9. MODAL EDITOR (THÊM / SỬA HOẠT ĐỘNG)
   ========================================================================== */
function openEditor(dateStr, editIndex = null) {
  ed = dateStr;
  ei = editIndex;
  renderEditorSheet();
  $("modalOverlay").classList.add("open");
  setTimeout(() => {
    const inp = $("inpTitle");
    if (inp) inp.focus();
  }, 100);
}

function closeEditor() {
  $("modalOverlay").classList.remove("open");
  ed = null;
  ei = null;
}

function handleBackdropClick(e) {
  if (e.target.id === "modalOverlay") closeEditor();
}

function renderEditorSheet() {
  if (!ed) return;
  const L = S.ev[ed] || [];
  const X = ei != null ? L[ei] : null;
  const last = L.filter(y => y.s).pop();
  const defaultStartTime = X ? (X.s || "") : last ? tt(last.s, last.h) : "07:00";

  const dateObj = new Date(ed + "T00:00");
  const dateFormatted = dateObj.toLocaleDateString("vi-VN", { weekday: "long", day: "numeric", month: "numeric", year: "numeric" });
  $("sheetTitle").innerHTML = `<span>📅 ${dateFormatted}</span>`;

  let html = "";

  if (L.length > 0) {
    html += `<div class="form-group">
      <div class="form-label">Hoạt động trong ngày (${L.length})</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${L.map((y, i) => {
          const cap = CM(y.c);
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:${i === ei ? 'var(--ac-soft)' : 'var(--card-subtle)'}; border-radius:var(--radius-md); border-left:4px solid ${cap.c};">
              <div>
                <div style="font-weight:600; font-size:13.5px;">
                  ${y.r ? '↻ ' : ''}${y.m === 'u' ? '▲ Nạp' : '▼ Tiêu'} ${esc(y.t)}
                </div>
                <div style="font-size:12px; color:var(--mu); margin-top:2px;">
                  ${y.s ? y.s + ' – ' + tt(y.s, y.h) + ' · ' : ''}${r1(y.h)}h · <span style="color:${cap.c}; font-weight:500;">${esc(cap.n)}</span>
                </div>
              </div>
              <div class="row" style="gap:4px;">
                <button class="btn btn-sm" onclick="editEvent(${i})">Sửa</button>
                <button class="btn btn-sm btn-ghost" style="color:var(--bad);" onclick="deleteEvent(${i})">Xóa</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>`;
  }

  html += `
    <div style="border-top:1px solid var(--bd); padding-top:14px; display:flex; flex-direction:column; gap:12px;">
      <div style="font-weight:600; font-size:14px; color:var(--tx);">
        ${X ? '✏️ Chỉnh sửa hoạt động' : '+ Thêm hoạt động mới'}
      </div>

      <div class="form-group">
        <label class="form-label" for="inpTitle">Tên hoạt động</label>
        <input id="inpTitle" placeholder="Ví dụ: Đánh cầu lông, Học tiếng Anh, Họp nhóm..." value="${X ? esc(X.t) : ''}" oninput="handleTitleInput(this.value)" onkeydown="if(event.key==='Enter') saveEventFromForm()">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="inpCap">Loại vốn</label>
          <select id="inpCap">
            ${S.caps.map(c => `<option value="${c.k}" ${X && X.c === c.k ? 'selected' : ''}>${esc(c.n)}</option>`).join("")}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="inpMode">Tác động năng lượng</label>
          <select id="inpMode">
            <option value="u" ${!X || X.m === 'u' ? 'selected' : ''}>▲ Nạp / Tái tạo vốn</option>
            <option value="d" ${X && X.m === 'd' ? 'selected' : ''}>▼ Tiêu / Rút vốn</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="inpStart">Giờ bắt đầu</label>
          <input id="inpStart" type="time" value="${defaultStartTime}">
        </div>

        <div class="form-group">
          <label class="form-label" for="inpHours">Thời lượng (giờ)</label>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="btn btn-sm" onclick="adjustHours(-0.5)">-0.5</button>
            <input id="inpHours" type="number" step="0.5" min="0.5" max="24" value="${X ? X.h : 2}" style="flex:1; text-align:center;">
            <button class="btn btn-sm" onclick="adjustHours(0.5)">+0.5</button>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:8px; margin-top:8px; justify-content:flex-end;">
        ${X ? `<button class="btn" onclick="ei=null; renderEditorSheet()">Hủy sửa</button>` : ''}
        <button class="btn btn-primary" onclick="saveEventFromForm()">
          ${X ? 'Lưu thay đổi' : 'Thêm vào lịch'}
        </button>
      </div>
    </div>
  `;

  $("sheetBody").innerHTML = html;
}

function handleTitleInput(val) {
  const guessedCap = guess(val);
  const select = $("inpCap");
  if (select && S.caps.some(c => c.k === guessedCap)) {
    select.value = guessedCap;
  }
}

function adjustHours(delta) {
  const inp = $("inpHours");
  if (!inp) return;
  const current = parseFloat(inp.value) || 2;
  inp.value = Math.max(0.5, Math.min(24, current + delta));
}

function editEvent(idx) {
  ei = idx;
  renderEditorSheet();
}

function saveEventFromForm() {
  const title = $("inpTitle").value.trim();
  const hours = +$("inpHours").value;
  const start = $("inpStart").value;

  if (!title) {
    showToast("Vui lòng nhập tên hoạt động!", "bad");
    $("inpTitle").focus();
    return;
  }
  if (!(hours > 0 && hours <= 24)) {
    showToast("Số giờ phải từ 0.5 đến 24!", "bad");
    return;
  }

  const o = {
    t: title,
    c: $("inpCap").value,
    m: $("inpMode").value,
    h: hours,
    s: start
  };

  const L = S.ev[ed] = S.ev[ed] || [];
  if (ei != null) {
    Object.assign(L[ei], o);
    ei = null;
    showToast("Đã cập nhật hoạt động", "ok");
  } else {
    L.push(o);
    showToast("Đã thêm hoạt động", "ok");
  }

  sortL(L);
  save();
  renderEditorSheet();
  draw();
}

function deleteEvent(idx) {
  if (!confirm("Bạn có chắc muốn xóa hoạt động này?")) return;
  S.ev[ed].splice(idx, 1);
  if (!S.ev[ed].length) delete S.ev[ed];
  ei = null;
  save();
  renderEditorSheet();
  draw();
  showToast("Đã xóa hoạt động", "ok");
}

function handleTimelineGridClick(event, dateStr) {
  if (event.target.closest(".timeline-event-block")) return;
  const rect = event.currentTarget.getBoundingClientRect();
  const y = event.clientY - rect.top;
  const hour = Math.min(23, Math.max(6, Math.floor(y / 48) + 6));
  openEditor(dateStr);
  setTimeout(() => {
    const inp = $("inpStart");
    if (inp) inp.value = pad(hour) + ":00";
  }, 120);
}

function scrollToCurrentWeek() {
  setTimeout(() => {
    const row = $("cw");
    const wrapper = $("yearTableWrapper");
    if (row && wrapper) {
      const thHeight = wrapper.querySelector("th") ? wrapper.querySelector("th").offsetHeight : 40;
      wrapper.scrollTop = Math.max(0, row.offsetTop - thHeight);
    }
  }, 60);
}

/* ==========================================================================
   10. QUẢN LÝ DỮ LIỆU & LOẠI VỐN
   ========================================================================== */
function updateCap(k, field, val) {
  if (field === "n" && !String(val).trim()) val = "Vốn";
  CM(k)[field] = val;
  save();
  draw();
  showToast("Đã cập nhật loại vốn", "ok");
}

function addCap() {
  const newKey = "c" + Date.now().toString(36);
  S.caps.push({
    k: newKey,
    n: "Vốn mới",
    c: PALETTE[S.caps.length % PALETTE.length],
    tg: 0
  });
  save();
  draw();
  showToast("Đã thêm loại vốn mới", "ok");
}

function deleteCap(k) {
  if (S.caps.length <= 1) {
    showToast("Phải giữ lại ít nhất một loại vốn!", "bad");
    return;
  }
  if (!confirm("Bạn có chắc muốn xóa loại vốn này?")) return;
  S.caps = S.caps.filter(c => c.k !== k);
  delete S.bl[k];
  save();
  draw();
  showToast("Đã xóa loại vốn", "ok");
}

function exportData(type) {
  const todayStr = new Date().toISOString().slice(0, 10);
  let content, filename, mime;

  if (type === "json") {
    content = JSON.stringify({ app: "life-capital", v: 1, at: new Date().toISOString(), data: S }, null, 2);
    filename = `life-capital-backup-${todayStr}.json`;
    mime = "application/json";
  } else {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [["Ngày", "Bắt đầu", "Kết thúc", "Hoạt động", "Loại vốn", "Tác động", "Số giờ", "Lặp lại"]];
    Object.keys(S.ev).sort().forEach(dt => {
      S.ev[dt].forEach(e => {
        rows.push([
          dt,
          e.s || "",
          e.s ? tt(e.s, e.h) : "",
          e.t,
          CM(e.c).n,
          e.m === "u" ? "Nạp" : "Tiêu",
          e.h,
          e.r ? "Có" : "Không"
        ]);
      });
    });
    content = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\n");
    filename = `life-capital-schedule-${todayStr}.csv`;
    mime = "text/csv;charset=utf-8;";
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Đã xuất tệp ${filename}`, "ok");
}

function importData(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const d = parsed && parsed.data;
      if (!parsed || parsed.app !== "life-capital" || !d || !Array.isArray(d.caps)) {
        throw new Error("Tệp không đúng định dạng Life Capital");
      }
      S = d;
      save();
      draw();
      showToast("Khôi phục dữ liệu thành công!", "ok");
    } catch (err) {
      alert("Tệp sao lưu không hợp lệ: " + err.message);
    }
    inputEl.value = "";
  };
  reader.readAsText(file);
}

/* ==========================================================================
   11. RENDER & KHỞI CHẠY
   ========================================================================== */
function draw() {
  const headerWk = $("headerWeekNum");
  if (headerWk) headerWk.textContent = sel + 1;
  renderNav();
  $("v").innerHTML = V[cur]();
  updateThemeButton();

  // Tự động cuộn đến tuần hiện tại nếu đang mở chế độ lưới 53 tuần
  if (cur === "ca" && calSubView === "year") {
    scrollToCurrentWeek();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (ed) closeEditor();
    closeReviewModal();
  }
});

const savedTheme = localStorage.getItem("lc_theme");
if (savedTheme) {
  document.documentElement.setAttribute("data-theme", savedTheme);
}

draw();
</script>
